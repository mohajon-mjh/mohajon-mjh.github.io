    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f8fafc; }
        .container { max-width: 1400px; margin: 0 auto; padding: 0 20px; }
        .page-header { display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 0 0.5rem; border-bottom: 1px solid #e9edf2; flex-wrap: wrap; gap: 10px; }
        .page-header h1 { font-size: 1.8rem; font-weight: 600; color: #0b1a2e; }
        .filter-bar { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; margin: 1.2rem 0 1.8rem; }
        .filter-bar .search-box { flex: 1 1 260px; display: flex; border-radius: 40px; background: white; border: 1px solid #dce1e8; }
        .filter-bar .search-box input { border: none; padding: 0.7rem 1.2rem; font-size: 0.95rem; width: 100%; background: transparent; outline: none; border-radius: 40px; }
        .filter-bar .category-select { padding: 0.6rem 2rem 0.6rem 1.2rem; border-radius: 40px; border: 1px solid #dce1e8; background: white; font-size: 0.95rem; min-width: 160px; cursor: pointer; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 24px; padding: 8px 0 40px; }
        .loading-placeholder { grid-column: 1 / -1; text-align: center; padding: 4rem 0; color: #5f6c80; }
        
        .product-card {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            transition: 0.2s;
        }
        .product-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
        
        .product-card-image {
            position: relative;
            width: 100%;
            height: 180px;
            background: #f1f3f5;
            overflow: hidden;
        }
        .product-card-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: #f1f3f5;
            padding: 5px;
        }
        .stock-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.6rem;
            font-weight: 600;
            color: white;
            z-index: 2;
            text-transform: uppercase;
        }
        .stock-badge.in-stock { background: #22c55e; }
        .stock-badge.low-stock { background: #f59e0b; }
        .stock-badge.out-of-stock { background: #ef4444; }
        
        .discount-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.6rem;
            font-weight: 700;
            background: #dc2626;
            color: white;
            z-index: 2;
        }
        
        .product-card-content {
            padding: 14px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .product-card-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin: 0 0 4px;
            color: #0b1a2e;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.3;
            min-height: 2.5rem;
        }
        .product-card-category {
            font-size: 0.75rem;
            color: #6b7a8f;
            margin-bottom: 6px;
        }
        .product-card-price {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 6px 0;
        }
        .current-price {
            font-size: 1.1rem;
            font-weight: 700;
            color: #0b1a2e;
        }
        .old-price {
            font-size: 0.85rem;
            color: #94a3b8;
            text-decoration: line-through;
        }
        .product-card-weight {
            font-size: 0.75rem;
            color: #6b7a8f;
            margin: 4px 0;
        }
        .product-card-actions {
            display: flex;
            gap: 6px;
            margin-top: auto;
            flex-wrap: wrap;
        }
        .product-card-actions button,
        .product-card-actions a {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .btn-add-to-cart {
            background: #2563eb;
            color: white;
            flex: 1;
        }
        .btn-add-to-cart:hover { background: #1d4ed8; }
        .btn-wishlist {
            background: #f1f3f5;
            color: #0b1a2e;
            font-size: 1rem;
            padding: 6px 12px;
            min-width: 35px;
        }
        .btn-wishlist.active {
            background: #fee2e2;
            color: #dc2626;
        }
        .btn-view-details {
            background: #f1f3f5;
            color: #0b1a2e;
            padding: 6px 12px;
            border-radius: 6px;
        }
        .btn-view-details:hover { background: #e5e7eb; }
        
        @media (max-width: 768px) {
            .filter-bar { flex-direction: column; align-items: stretch; }
            .product-grid { 
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
                gap: 12px; 
            }
            .product-card-image { 
                height: 140px; 
            }
            .product-card-title {
                font-size: 0.8rem;
                min-height: 2rem;
            }
            .current-price {
                font-size: 0.95rem;
            }
            .product-card-actions button,
            .product-card-actions a {
                font-size: 0.65rem;
                padding: 5px 8px;
            }
            .product-card-content {
                padding: 10px;
            }
            .stock-badge, .discount-badge {
                font-size: 0.5rem;
                padding: 2px 8px;
            }
        }

        @media (max-width: 480px) {
            .product-grid { 
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); 
                gap: 10px; 
            }
            .product-card-image { 
                height: 120px; 
            }
        }
    </style>

        window.db = firebase.database();

        window.db.ref('products').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                const cats = new Set();
                Object.values(data).forEach(p => {
                    if (p.category) cats.add(p.category);
                });
                const select = document.getElementById('categoryFilter');
                select.innerHTML = '<option value="all">All Categories</option>';
                cats.forEach(cat => {
                    const opt = document.createElement('option');
                    opt.value = cat;
                    opt.textContent = cat;
                    select.appendChild(opt);
                });
            }
        });

<script>/*fullSearch-v2*/
(function(){
 var full=null,timer=null;
 var inp=document.getElementById("searchInput");if(!inp)return;
 function show(list){
  var grid=document.getElementById("productGrid");if(!grid||!window.createProductCard)return;
  grid.innerHTML="";
  if(!list.length){grid.innerHTML='<div class="loading-placeholder">No products found</div>';}
  else list.slice(0,200).forEach(function(x){grid.appendChild(createProductCard(x));});
  var c=document.getElementById("product-count");if(c)c.textContent=list.length+" items";
 }
 inp.addEventListener("input",function(){
  clearTimeout(timer);
  var q=inp.value.trim().toLowerCase();
  if(q.length<2)return;
  timer=setTimeout(function(){
   (full?Promise.resolve(full):new Promise(function(res){window.db.ref("products").once("value",function(s){full=s.val()||{};res(full);});})).then(function(data){
    var list=Object.keys(data).map(function(id){return Object.assign({id:id},data[id]);}).filter(function(x){return x.status==="active"&&(x.title||"").toLowerCase().indexOf(q)>-1;});
    show(list);
   });
  },400);
 });
})();
</script>

<script>/*mjhArrowsV5-NAMED*/
(function(){
var LIMIT=20;
/* ===== ৮৬টা ক্যাটাগরি নাম ধরে ধরে ===== */
var CATEGORIES=[
 /* Flash Sale (5) */ "Up To 5% Off","Special Offers for One Week","Electronics Deals","Fashion Sale","Home Essentials",
 /* Deals of Day (4) */ "Best Sellers","New Arrivals","Top Rated","Recommended For You",
 /* Special Categories (6) */ "Second-Hand & Refurbished Goods","Musical Instruments","Printing Supplies","Seasonal & Festival Products","Islamic & Religious Products","Wedding & Event Supplies",
 /* Main Sections (3) */ "Trending Products","Featured Products","Coming Soon",
 /* Global Categories (20) */ "Electronics","Computers","TV & Appliances","Watches","Men Fashion","Women Fashion","Mother & Baby","Toys & Games","Grocery","Spices","Food & Beverages","Beauty","Health","Home & Kitchen","Automotive","Sports","Pet Supplies","Books","Travel","Gift Items",
 /* 47 Slugs */ "Agriculture, Food & Beverage","Appliances","Art & Collectibles","Automotive Parts","Baby Products","Beauty & Personal Care","Books & Media","Business & Industrial","Cameras & Photo","Clothing & Fashion","Computers & Tablets","Construction","Consumer Electronics","Electrical","Electronics TV Audio","Food & Grocery","Furniture & Decor","Gardening","Gifts & Crafts","Health & Medical","Health & Wellness","Home & Kitchen","Tools & Hardware","Industrial","Jewelry & Watches","Lighting & Lamps","Luggage & Bags","Office & School","Pet Supplies","Renewable Energy","Safety & Security","Shoes","Smart Home","Sports & Fitness","Toys & Hobbies","Video Games","Vehicles","AC & Fridge","Mobile Phones","Laptops & PCs","Headphones","Makeup","Sofa & Beds","Power Tools","Drones","Bicycles"
];
function cardsOf(g){var out=[],ch=g.children;for(var i=0;i<ch.length;i++){if(ch[i].classList&&ch[i].classList.contains("product-card"))out.push(ch[i]);}return out;}
function makeArrow(g){
 var old=g.querySelector(".mjh-ar5");if(old)old.remove();
 var hid=cardsOf(g).filter(function(c){return c.style.display==="none";});
 if(!hid.length)return;
 var a=document.createElement("div");a.className="mjh-ar5";
 a.innerHTML="<span>→</span>";
 a.style.cssText="flex:0 0 56px;display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer;background:#fff;border-radius:10px;margin-left:6px;border:1px solid #e5e7eb;";
 a.onclick=function(){
  var h2=cardsOf(g).filter(function(c){return c.style.display==="none";});
  for(var i=0;i<h2.length&&i<LIMIT;i++)h2[i].style.display="";
  var rest=cardsOf(g).filter(function(c){return c.style.display==="none";});
  if(!rest.length)a.remove();
  g.scrollBy({left:400,behavior:"smooth"});
 };
 g.appendChild(a);
}
function process(g){
 if(!g)return 0;
 var cards=cardsOf(g);
 if(cards.length<=LIMIT)return 0;
 if(g.getAttribute("data-ar5")===String(cards.length))return 1;
 g.setAttribute("data-ar5",String(cards.length));
 for(var i=0;i<cards.length;i++)cards[i].style.display=i<LIMIT?"":"none";
 makeArrow(g);
 return 1;
}
function byId(id){var g=document.getElementById(id);if(g){return process(g);}return 0;}
function bySlug(slug){
 var g=document.getElementById("productsGrid")||document.getElementById("productGrid")||document.getElementById("categoryProductsGrid")||document.querySelector('[data-cat="'+slug+'"]');
 if(g){return process(g);}return 0;
}
function scan(){
 var r=[];
 /* ===== নাম ধরে ধরে — প্রতিটা আলাদা ===== */
 /* Flash Sale grid */ r.push("FlashSale:"+byId("flashSaleProductsGrid"));
 /* Trending grid */ r.push("Trending:"+byId("trendingProductsGrid"));
 /* Special Categories carousel */ r.push("Special:"+byId("specialCatCarousel"));
 /* Deals of Day grid (4 tabs) */ r.push("Deals:"+byId("dealsGrid"));
 /* Featured grid */ r.push("Featured:"+byId("featuredProducts"));
 /* Coming Soon grid */ r.push("ComingSoon:"+byId("comingSoonGrid"));
 /* Global Categories carousel (20 cats) */ r.push("Global:"+byId("globalCatCarousel"));
 /* Slug pages */ r.push("Slug:"+bySlug("products"));
 /* Auto-detect any other grid with 20+ cards */
 var ds=document.querySelectorAll("div,ul,section");
 for(var i=0;i<ds.length;i++){
  var d=ds[i];if(d.id&&/Grid|Carousel|Products/i.test(d.id))continue;
  var cards=cardsOf(d);
  if(cards.length>20&&d.getAttribute("data-ar5")!==String(cards.length)){
   process(d);
   r.push("Auto:"+(d.id||"div"));
  }
 }
 window.MJH_V5_REPORT=r.join(" | ");
 window.MJH_V5_CATEGORIES=CATEGORIES.length;
}
var n=0;var iv=setInterval(function(){n++;scan();if(n>25)clearInterval(iv);},2000);
setTimeout(scan,1500);setTimeout(scan,5000);setTimeout(scan,9000);setTimeout(scan,14000);
})();
</script>
