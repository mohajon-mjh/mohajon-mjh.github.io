async function allProducts(){if(!ALL){var s=await get(ref(db,"products"));ALL=s.val()||{};}return ALL;}
async function catName(s,id){var c=await get(ref(db,s.catNode+"/"+id));return ((c.val()||{}).name)||id;}
function smartTitle(f){var n=f.replace(/\.[^.]+$/,"").replace(/[_-]+/g," ").trim();return n.replace(/\b(\w)(\w*)/g,function(a,b,c){return b.toUpperCase()+c.toLowerCase();});}
function norm(s){return String(s||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();}
function parseLine(line){line=line.trim().replace(/[,،]\s*$/,"");var name="",price=0,di=-1;for(var i=line.length-1;i>=0;i--){var ch=line.charAt(i);if(ch==="\u2014"||ch==="\u2013"){di=i;break;}}if(di>-1){name=line.slice(0,di).trim();price=parseFloat(line.slice(di+1).replace(/[^\d.]/g,""))||0;}else{var pm=line.match(/\u09F3\s*([\d,]+(?:\.\d+)?)/);if(pm){price=parseFloat(pm[1].replace(/,/g,""))||0;name=line.replace(pm[0],"").trim();}else{var em=line.match(/\s([\d,]+(?:\.\d+)?)$/);if(em){price=parseFloat(em[1].replace(/,/g,""))||0;name=line.slice(0,line.length-em[0].length).trim();}}}return{name:name,price:price};}
function score(t,n){var tw=norm(t).split(" ").filter(Boolean);var nw=norm(n).split(" ").filter(Boolean);if(!tw.length||!nw.length)return 0;var hits=0;nw.forEach(function(w){if(tw.indexOf(w)>-1)hits++;});if(norm(t).indexOf(norm(n))>-1||norm(n).indexOf(norm(t))>-1)return 1;return nw.length?hits/nw.length:0;}
function calc(p,d){return Math.round((+p||0)*(1-(+d||0)/100));}
function noteTxt(pr,dc){pr=+pr||0;dc=+dc||0;var cu=calc(pr,dc);if(dc>0)return "৳"+pr+" → ৳"+cu+" (Save ৳"+(pr-cu)+")";return "৳"+cu+" (কোনো ডিসকাউন্ট নেই)";}
function side(){var b=$("sideBtns");b.innerHTML="";SECTIONS.forEach(function(s){var el=document.createElement("button");el.textContent=s.name;if(s.key===CURSEC)el.classList.add("on");el.onclick=function(){CURSEC=s.key;CURCAT=null;MODE="own";pending=[];side();route();};b.appendChild(el);});}
function route(){var s=S();if(!s){$("mainArea").innerHTML="<p>Section সিলেক্ট করুন</p>";return;}if(s.hasCats&&!CURCAT)renderCats(s);else openProducts(s);}
async function renderCats(s){
 var cs=await get(ref(db,s.catNode));var cats=Object.entries(cs.val()||{}).sort(function(a,b){return (a[1].order||0)-(b[1].order||0);});
 var m=$("mainArea");
 m.innerHTML="<h3>"+s.name+" — ক্যাটাগরি ("+cats.length+")</h3><div class='bar'><input id='newCat' placeholder='নতুন ক্যাটাগরির নাম' style='flex:1'><input id='newOrd' type='number' value='0' style='width:60px'><button class='btn' style='background:#27ae60' id='addCat'>➕ নতুন যোগ</button></div><div id='catList'></div>";
 var L=$("catList");
 cats.forEach(function(e){var id=e[0],c=e[1];var d=document.createElement("div");d.className="bar";d.innerHTML="<input type='checkbox' class='cChk' data-id='"+id+"'> <b>"+(c.name||id)+"</b> <span style='color:#888;font-size:12px'>Order: "+(c.order||0)+"</span><span style='flex:1'></span><button class='btn' style='background:#27ae60' data-open='"+id+"'>📦 প্রোডাক্ট</button><button class='btn' data-edit='"+id+"'>✏️ Edit</button><button class='btn' style='background:#c0392b' data-del='"+id+"'>🗑️ Delete</button>";L.appendChild(d);});
 $("addCat").onclick=async function(){var n=$("newCat").value.trim();if(!n)return toast("❌ নাম দিন","#c0392b");var id=n.toLowerCase().replace(/[^a-z0-9]+/g,"_");await set(ref(db,s.catNode+"/"+id),{name:n,order:+$("newOrd").value||0});toast("✅ ক্যাটাগরি যোগ");renderCats(s);};
 L.onclick=async function(e){
  var o=e.target.closest("[data-open]");if(o){CURCAT=o.dataset.open;MODE="own";route();return;}
  var ed=e.target.closest("[data-edit]");if(ed){var nn=prompt("নতুন নাম:");if(nn){await update(ref(db,s.catNode+"/"+ed.dataset.edit),{name:nn});renderCats(s);}return;}
  var dl=e.target.closest("[data-del]");if(dl){if(confirm("ক্যাটাগরি ডিলিট?")){await remove(ref(db,s.catNode+"/"+dl.dataset.del));await remove(ref(db,s.prodPath+"/"+dl.dataset.del));renderCats(s);}return;}
 };
}
async function openProducts(s){
 var title=s.hasCats?(s.name+" ▸ "+(await catName(s,CURCAT))):s.name;
 var m=$("mainArea");
 m.innerHTML="<h3>"+title+"</h3>"+
 (s.hasCats?"<div class='bar'><button class='btn' id='backCats'>← ক্যাটাগরি লিস্ট</button></div>":"")+
 "<div class='bar'><button class='btn' id='navView'>🛍️ প্রোডাক্ট ভিউ</button><button class='btn' id='navAdd'>➕ নতুন প্রোডাক্ট এড</button></div>"+
 "<div id='viewSec'>"+
 "<div class='bar'><button class='btn' id='subOwn'>"+(s.hasCats?"📦 এই ক্যাটাগরির প্রোডাক্ট":"📦 এই সেকশনের প্রোডাক্ট")+"</button><button class='btn' id='subAll'>🗂️ All Products</button><button class='btn' id='subSearch'>🔍 Search Products</button></div>"+

 "<div class='bar'><input type='file' id='addFiles' accept='image/*' multiple style='flex:1'></div>"+

 "<div class='bar'><button class='btn' id='saveAll'>💾 সিলেক্টেড সব Save</button><span id='saveSt'></span></div></div>"+

 "<div class='bar'><label><input type='checkbox' id='selAll'> সব সিলেক্ট করুন</label> % <input id='bulkDisc' type='number' style='width:60px'> <button class='btn' id='bulkApply'>✅ সিলেক্টেডে % বসান</button><button class='btn' id='bulkSave'>💾 সিলেক্টেড Save</button><button class='btn' style='background:#c0392b' id='bulkDel'>🗑️ সিলেক্টেড রিমুভ</button></div>"+
 "<div class='bar'>শুরুর তারিখ <input id='bStart' style='width:110px' placeholder='dd-mm-yyyy'> শেষের তারিখ <input id='bEnd' style='width:110px' placeholder='dd-mm-yyyy'> <button class='btn' id='bDate'>📅 সিলেক্টেডে তারিখ বসান</button><span id='bSt'></span></div>"+
 "<div id='addList'></div><div id='pList'></div></div>";
 if($("backCats"))$("backCats").onclick=function(){CURCAT=null;route();};
 $("navView").onclick=function(){$("addSec").style.display="none";loadList(s);toast("🛍️ প্রোডাক্ট ভিউ");};
 $("navAdd").onclick=function(){var a=$("addSec");a.style.display=a.style.display==="none"?"":"none";if(a.style.display!=="none"){a.scrollIntoView({behavior:"smooth"});toast("➕ নতুন প্রোডাক্ট এড");}};
 $("subOwn").onclick=function(){MODE="own";$("searchBox").style.display="none";loadList(s);toast("📦 এই ক্যাটাগরির প্রোডাক্ট");};

 $("selAll").onchange=function(e){document.querySelectorAll(".pChk,.aChk").forEach(function(c){c.checked=e.target.checked;});toast(e.target.checked?"✅ সব সিলেক্ট হলো":"সিলেক্ট মুছে গেলো");};
 $("bulkApply").onclick=async function(){var d=+$("bulkDisc").value||0;var up={};var n=0;document.querySelectorAll(".pChk:checked").forEach(function(c){var card=c.closest(".pCard");card.querySelector(".pDisc").value=d;var pr=+card.querySelector(".pPrice").value||0;card.querySelector(".pCur").value=calc(pr,d);var nt=card.querySelector(".pNote");if(nt)nt.innerHTML=noteTxt(pr,d);up["products/"+c.dataset.id+"/discountPercent"]=d;n++;});await update(ref(db),up);ALL=null;toast("✅ "+n+"টার % বসল");};
 $("bulkSave").onclick=async function(){var n=0;for(var c of document.querySelectorAll(".pChk:checked")){var card=c.closest(".pCard");var up={price:+card.querySelector(".pPrice").value||0,discountPercent:+card.querySelector(".pDisc").value||0,startDate:card.querySelector(".pStart").value,endDate:card.querySelector(".pEnd").value,updatedAt:Date.now()};await update(ref(db,"products/"+c.dataset.id),up);if(s.hasCats)await update(ref(db,s.prodPath+"/"+CURCAT+"/"+c.dataset.id),{startDate:up.startDate,endDate:up.endDate});n++;}ALL=null;toast("✅ "+n+"টা Save");};
 $("bulkDel").onclick=async function(){var ids=[].slice.call(document.querySelectorAll(".pChk:checked")).map(function(c){return c.dataset.id;});if(!ids.length)return toast("❌ সিলেক্ট নেই","#c0392b");if(!confirm(ids.length+"টা ডিলিট?"))return;var up={};ids.forEach(function(id){up["products/"+id]=null;up["futureProducts/"+id]=null;if(s.hasCats)up[s.prodPath+"/"+CURCAT+"/"+id]=null;});await update(ref(db),up);ALL=null;toast("✅ ডিলিট");loadList(s);};
 $("bDate").onclick=async function(){var st=$("bStart").value,en=$("bEnd").value;var up={};var n=0;document.querySelectorAll(".pChk:checked").forEach(function(c){var card=c.closest(".pCard");card.querySelector(".pStart").value=st;card.querySelector(".pEnd").value=en;up["products/"+c.dataset.id+"/startDate"]=st;up["products/"+c.dataset.id+"/endDate"]=en;if(s.hasCats){up[s.prodPath+"/"+CURCAT+"/"+c.dataset.id+"/startDate"]=st;up[s.prodPath+"/"+CURCAT+"/"+c.dataset.id+"/endDate"]=en;}n++;});await update(ref(db),up);toast("✅ "+n+"টার তারিখ বসল");};
 $("addFiles").onchange=function(e){[].slice.call(e.target.files).forEach(function(f){pending.push({title:smartTitle(f.name),price:0,stock:10,file:f,checked:true,thumb:URL.createObjectURL(f)});});renderAdd();toast("✅ "+pending.length+"টা ফাইল লোড");};
 $("addPasteApply").onclick=async function(){var lines=$("addPaste").value.split("\n").map(function(l){return l.trim();}).filter(Boolean);var parsed=lines.map(parseLine).filter(function(q){return q.name&&q.price>0;});var used={};var n=0;pending.forEach(function(p){var best=null,bs=0,bi=-1;parsed.forEach(function(q,qi){var sc=score(p.title,q.name);if(sc>bs){bs=sc;best=q;bi=qi;}});if(best&&bs>=0.5){p.price=best.price;used[bi]=1;n++;}});parsed.forEach(function(q,qi){if(!used[qi])pending.push({title:q.name,price:q.price,stock:10,file:null,checked:true,thumb:PLACEHOLDER});});var up={};var mm=0;document.querySelectorAll("#pList .pCard").forEach(function(card){var t2=card.querySelector("b").textContent;var best=null,bs=0;parsed.forEach(function(q){var sc=score(t2,q.name);if(sc>bs){bs=sc;best=q;}});if(best&&bs>=0.5){var id=card.querySelector(".pPrice").dataset.id;card.querySelector(".pPrice").value=best.price;var dc=+card.querySelector(".pDisc").value||0;card.querySelector(".pCur").value=calc(best.price,dc);var nt=card.querySelector(".pNote");if(nt)nt.innerHTML=noteTxt(best.price,dc);up["products/"+id+"/price"]=best.price;mm++;}});if(mm)await update(ref(db),up);ALL=null;renderAdd();toast("✅ দাম বসল: নতুন "+n+"টা + আগের পণ্য "+mm+"টা");};
 $("saveAll").onclick=async function(){var sel=pending.filter(function(p){return p.checked;});if(!sel.length)return toast("❌ খালি","#c0392b");var n=0;for(var p of sel){await saveOne(s,p);n++;$("saveSt").textContent="⏳ "+n+"/"+sel.length;}pending=[];renderAdd();ALL=null;toast("✅ "+n+"টা Save হয়েছে — home-এ দেখুন");loadList(s);};
 loadList(s);

async function saveOne(s,p){
 var id="p_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
 var url="";
 if(p.file){try{url=await compress(p.file);}catch(e){url="";}}
 var obj={title:p.title,price:p.price,stock:p.stock,status:"active",createdAt:Date.now(),startDate:p.start||"",endDate:p.end||"",images:{main:url||""}};
 await set(ref(db,"products/"+id),obj);
 if(s.hasCats&&CURCAT)await set(ref(db,s.prodPath+"/"+CURCAT+"/"+id),{id:id,addedAt:Date.now()});
 if(s.flag)await update(ref(db,"products/"+id),{[s.flag]:true});
 if(s.cs)await set(ref(db,"futureProducts/"+id),{title:p.title,expectedPrice:p.price,discountPercent:0,categoryId:"coming_soon",createdAt:Date.now(),released:false,images:{main:url||""}});
}
function compress(file){return new Promise(function(res){var rd=new FileReader();rd.onload=function(){var img=new Image();img.onload=function(){var c=document.createElement("canvas");var w=400,h2=Math.round(400*img.height/img.width)||400;c.width=w;c.height=h2;var cx=c.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,w,h2);cx.drawImage(img,0,0,w,h2);res(c.toDataURL("image/jpeg",0.72));};img.onerror=function(){res("");};img.src=rd.result;};rd.readAsDataURL(file);});}
function renderAdd(){
 var L=$("addList");if(!L)return;
 L.innerHTML=pending.map(function(p,i){return "<div class='pCard'>"+
 "<div class='row'><input type='checkbox' class='aChk' data-i='"+i+"' "+(p.checked?"checked":"")+"> <img class='thumb' src='"+(p.thumb||PLACEHOLDER)+"'> <b class='aTitle' data-i='"+i+"' style='cursor:pointer;flex:1'>"+String(p.title).replace(/</g,"&lt;")+"</b></div>"+
 "<div class='row'>মূল দাম / Market Price (৳)</div>"+
 "<div class='row'><input type='number' class='aPrice' value='"+p.price+"' data-i='"+i+"' style='flex:1'></div>"+
 "<div class='row'>Discount % <input type='number' class='aDisc' value='"+(p.disc||0)+"' data-i='"+i+"' style='width:70px'></div>"+

 "<div class='row'><input class='aCurIn' value='"+calc(p.price,p.disc||0)+"' data-i='"+i+"' readonly style='flex:1;color:#7CFC00'></div>"+
 "<div class='row aNote' style='background:#141a22;padding:6px 8px;border-radius:4px;font-size:13px'>"+noteTxt(p.price,p.disc||0)+"</div>"+
 "<div class='row'>Offer শুরুর তারিখ <input class='aStart' value='"+(p.start||"")+"' data-i='"+i+"' style='width:130px'></div>"+
 "<div class='row'>Offer শেষের তারিখ <input class='aEnd' value='"+(p.end||"")+"' data-i='"+i+"' style='width:130px'></div>"+
 "<div class='row'>Stock <input type='number' class='aStock' value='"+p.stock+"' data-i='"+i+"' style='width:70px'></div>"+
 "<div class='row'><button class='btn' style='background:#2980b9' data-save1='"+i+"'>💾 Save</button><button class='btn' style='background:#c0392b' data-x='"+i+"'>🗑️ Remove</button></div>"+
 "</div>";}).join("");
 L.oninput=function(e){var t=e.target;if(!t.dataset||t.dataset.i===undefined)return;var p=pending[+t.dataset.i];if(!p)return;
  if(t.classList.contains("aPrice"))p.price=+t.value||0;

  else if(t.classList.contains("aEnd"))p.end=t.value;
  else if(t.classList.contains("aStock"))p.stock=+t.value||0;
  var card=t.closest(".pCard");if(card){card.querySelector(".aCurIn").value=calc(p.price,p.disc||0);card.querySelector(".aNote").innerHTML=noteTxt(p.price,p.disc||0);}
 };
 L.onchange=function(e){var t=e.target;if(t.classList.contains("aChk")){var p=pending[+t.dataset.i];if(p)p.checked=t.checked;}};
 L.onclick=function(e){
  var b=e.target.closest("[data-x]");if(b){pending.splice(+b.dataset.x,1);renderAdd();toast("🗑️ বাদ দেওয়া হলো");return;}
  var sv=e.target.closest("[data-save1]");if(sv){var idx=+sv.dataset.save1;var pp=pending[idx];if(pp){saveOne(S(),pp).then(function(){pending.splice(idx,1);ALL=null;renderAdd();toast("✅ Save হয়েছে — home-এ দেখুন");loadList(S());});}return;}
  var tt=e.target.closest(".aTitle");if(tt){var qq=pending[+tt.dataset.i];if(qq){var nn=prompt("নতুন নাম:",qq.title);if(nn){qq.title=nn;renderAdd();}}}
 };
}
async function loadList(s){
 var items=[];
 if(s.cs){var f=await get(ref(db,"futureProducts"));items=Object.entries(f.val()||{}).filter(function(e){return !e[1].released;});}
 else if(s.hasCats){
  var all=await allProducts();
  if(MODE==="own"){var mp=(await get(ref(db,s.prodPath+"/"+CURCAT))).val()||{};items=Object.keys(mp).map(function(k){var pid=(mp[k]&&mp[k].id)||k;return [pid,all[pid]||{},mp[k]||{}];}).filter(function(r){return r[1]&&r[1].title;});}
  else{items=Object.entries(all).map(function(e){return [e[0],e[1],{}];});if(MODE==="search"){var q=($("searchInp")?$("searchInp").value:"").toLowerCase();items=items.filter(function(r){return (r[1].title||"").toLowerCase().includes(q);});}}
 }else{
  var all2=await allProducts();
  if(MODE==="own")items=Object.entries(all2).filter(function(e){return e[1][s.flag]===true;}).map(function(e){return [e[0],e[1],{}];});
  else{items=Object.entries(all2).map(function(e){return [e[0],e[1],{}];});if(MODE==="search"){var q2=($("searchInp")?$("searchInp").value:"").toLowerCase();items=items.filter(function(r){return (r[1].title||"").toLowerCase().includes(q2);});}}
 }
 renderRows(s,items);
}
function renderRows(s,items){
 var L=$("pList");L.innerHTML="";
 if(!items.length){L.innerHTML="<p style='color:#888'>এই ক্যাটাগরিতে পণ্য নেই — ➕ নতুন প্রোডাক্ট এড থেকে যোগ করুন</p>";return;}
 items.forEach(function(e){var id=e[0],p=e[1],mi=e[2]||{};
  var price=+p.price||0,disc=+p.discountPercent||0,cur=calc(price,disc);
  var stt=mi.startDate||p.startDate||"",enn=mi.endDate||p.endDate||"";
  var note=disc>0?("৳"+price+" → ৳"+cur+" (Save ৳"+(price-cur)+")"):("৳"+cur+" (কোনো ডিসকাউন্ট নেই)");
  var thumb=(p.images&&p.images.main)?p.images.main:PLACEHOLDER;
  var d=document.createElement("div");d.className="pCard";
  d.innerHTML="<div class='row'><input type='checkbox' class='pChk' data-id='"+id+"'> <img class='thumb' src='"+thumb+"'> <b style='flex:1'>"+(p.title||id)+"</b></div>"+
  "<div class='row'>মূল দাম / Market Price (৳)</div>"+
  "<div class='row'><input class='pPrice' type='number' value='"+price+"' style='flex:1' data-id='"+id+"'></div>"+
  "<div class='row'>Discount % <input class='pDisc' type='number' value='"+disc+"' style='width:70px'></div>"+
  "<div class='row'>বর্তমান দাম (৳) — অটো ক্যালকুলেটেড হয়</div>"+
  "<div class='row'><input class='pCur' value='"+cur+"' readonly style='flex:1;color:#7CFC00'></div>"+
  "<div class='row pNote' style='background:#141a22;padding:6px 8px;border-radius:4px;font-size:13px'>"+note+"</div>"+
  "<div class='row'>Offer শুরুর তারিখ <input class='pStart' value='"+stt+"' style='width:130px'></div>"+
  "<div class='row'>Offer শেষের তারিখ <input class='pEnd' value='"+enn+"' style='width:130px'></div>"+
  "<div class='row'><button class='btn' style='background:#2980b9' data-save='"+id+"'>💾 Save</button><button class='btn' style='background:#c0392b' data-del='"+id+"'>🗑️ Remove</button></div>";
  L.appendChild(d);
 });
 L.oninput=function(e){var t=e.target;if(t.classList.contains("pPrice")||t.classList.contains("pDisc")){var card=t.closest(".pCard");var pr=+card.querySelector(".pPrice").value||0;var dc=+card.querySelector(".pDisc").value||0;var cu=calc(pr,dc);card.querySelector(".pCur").value=cu;card.querySelector(".pNote").innerHTML=dc>0?("৳"+pr+" → ৳"+cu+" (Save ৳"+(pr-cu)+")"):("৳"+cu+" (কোনো ডিসকাউন্ট নেই)");}};
 L.onclick=async function(e){
  var sv=e.target.closest("[data-save]");
  if(sv){var id=sv.dataset.save;var card=sv.closest(".pCard");var up={price:+card.querySelector(".pPrice").value||0,discountPercent:+card.querySelector(".pDisc").value||0,startDate:card.querySelector(".pStart").value,endDate:card.querySelector(".pEnd").value,updatedAt:Date.now()};await update(ref(db,"products/"+id),up);if(s.hasCats)await update(ref(db,s.prodPath+"/"+CURCAT+"/"+id),{startDate:up.startDate,endDate:up.endDate});ALL=null;toast("✅ Save");return;}
  var dl=e.target.closest("[data-del]");
  if(dl){if(confirm("পণ্য সম্পূর্ণ মুছবেন?")){var up2={};up2["products/"+dl.dataset.del]=null;up2["futureProducts/"+dl.dataset.del]=null;if(s.hasCats)up2[s.prodPath+"/"+CURCAT+"/"+dl.dataset.del]=null;await update(ref(db),up2);ALL=null;toast("✅ মুছে গেছে");loadList(s);}return;}
 };
}
side();route();
</script>
