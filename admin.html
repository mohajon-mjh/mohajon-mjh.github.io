<!DOCTYPE html>
<html lang="en">
<head>

<script type="module">/*helpFinal-v1*/
import{getDatabase,ref,onValue,get,set,push,update}from"https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";
import{initializeApp,getApps,getApp}from"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
const app=getApps().length?getApp():initializeApp({"apiKey":"AIzaSyDj_LLHWBgcKfQClnaOUqEtULHhP1vSVxw","databaseURL":"https://mohajon-mjh-default-rtdb.firebaseio.com","projectId":"mohajon-mjh","appId":"1:526105903976:web:f9321c6d68ecbd19d58cdd"});
const db=getDatabase(app);
let ov=document.getElementById("helpOverlay");
if(!ov){ov=document.createElement("div");ov.id="helpOverlay";
ov.style.cssText="display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:99998;overflow:auto";
ov.innerHTML='<div style="max-width:720px;margin:20px auto;background:#131921;border-radius:12px;padding:14px"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="color:#fff;margin:0">❓ Help Center</h3><button onclick="document.getElementById(\'helpOverlay\').style.display=\'none\'" style="background:#c0392b;color:#fff;border:none;border-radius:6px;padding:6px 12px;font-weight:700">✕ বন্ধ</button></div><div id="helpListF" style="margin-top:10px">লোড হচ্ছে...</div></div>';
document.body.appendChild(ov);}
function addSideBtn(){
 if(document.getElementById("hSB"))return;
 const w=[...document.querySelectorAll("button,li,a")].find(e=>/Withdrawals/.test(e.textContent||""));
 if(!w)return;
 const b=document.createElement("button");b.id="hSB";b.type="button";
 b.innerHTML="❓ Help Center";
 b.style.cssText="background:linear-gradient(90deg,#7CFC00,#00a651);color:#111;border:none;border-radius:6px;padding:10px 14px;font-weight:700;cursor:pointer;margin:6px 0;width:100%;box-shadow:0 0 12px rgba(124,252,0,.6)";
 b.onclick=()=>{ov.style.display="block";window._lh&&window._lh();};
 w.parentNode.insertBefore(b,w.nextSibling);
}
for(const t of [500,1500,3000])setTimeout(addSideBtn,t);
function findBell(){return [...document.querySelectorAll("button,div,span")].find(e=>(e.textContent||"").indexOf("🔔")>=0&&(e.textContent||"").length<=15);}
function updateBell(n){
 const b=findBell();if(!b)return;
 if(n>0&&(b.textContent||"").indexOf("❓")<0){b.innerHTML=b.innerHTML+" <b style='color:#7CFC00;font-size:13px'>❓"+n+"</b>";}
 else if(n===0&&b.textContent.includes("❓")){b.textContent=b.textContent.replace(/\s*❓\d+/,"");}
}
window._lh=async()=>{
 document.getElementById("helpListF").innerHTML="লোড হচ্ছে...";
 const t=await get(ref(db,"supportTickets"));
 const all=Object.entries(t.val()||{}).filter(([id,x])=>(x.subject||"").indexOf("HELP")===0).sort((a,b)=>b[1].createdAt-a[1].createdAt);
 for(const [id,x] of all){
  if(x.status==="open"&&(x.message||"").indexOf("🤖")===-1){
   const low=(x.subject+" "+x.message).toLowerCase();
   let auto="🤖 ধন্যবাদ! Team ২৪ ঘণ্টার মধ্যে উত্তর দেবে।";
   if(/deliver|দেরি|পণ্য|order/.test(low))auto="🤖 প্রিয় গ্রাহক, পণ্য ১৪ দিনের মধ্যে পৌঁছে যাবে।";
   else if(/pay|bkash|টাকা/.test(low))auto="🤖 Payment: bKash 0171317668288 অথবা COD।";
   await update(ref(db,"supportTickets/"+id),{message:x.message+"\n"+auto,status:"pending"});
  }
 }
 const fresh=await get(ref(db,"supportTickets"));
 const all2=Object.entries(fresh.val()||{}).filter(([id,x])=>(x.subject||"").indexOf("HELP")===0).sort((a,b)=>b[1].createdAt-a[1].createdAt);
 updateBell(all2.filter(([id,x])=>x.status!=="closed").length);
 document.getElementById("helpListF").innerHTML=all2.map(([id,x])=>{
  return '<div style="background:#232f3e;padding:12px;border-radius:8px;margin:8px 0"><b style="color:#FF9900">'+x.subject+'</b> | <b style="color:'+(x.status==="closed"?"#7CFC00":"#FF9900")+'">'+x.status+'</b><br>'+
  (x.message||"").split("\n").map(l=>'<div style="font-size:13px;margin:3px 0;color:'+(l.indexOf("🛠️")===0?"#7CFC00":l.indexOf("🤖")===0?"#88ccff":"#fff")+'">'+l+'</div>').join("")+
  (x.status!=="closed"?'<div style="display:flex;gap:6px;margin-top:8px"><input id="hrf_'+id+'" placeholder="Reply..." style="flex:1;padding:7px;background:#1a242f;color:#fff;border:1px solid #555;border-radius:6px"><button onclick="window._hr(\''+id+'\')" style="background:#FF9900;color:#111;border:none;border-radius:6px;padding:7px 12px;font-weight:700">📨 Reply</button><button onclick="window._hc(\''+id+'\')" style="background:#7CFC00;color:#111;border:none;border-radius:6px;padding:7px 12px;font-weight:700">✅ Close</button></div>':'')+'</div>';
 }).join("")||'<p style="color:#888">কোনো ticket নেই</p>';
};
window._hr=async(id)=>{const el=document.getElementById("hrf_"+id);const v=el.value.trim();if(!v)return;
const cur=(await get(ref(db,"supportTickets/"+id))).val();
await update(ref(db,"supportTickets/"+id),{message:cur.message+"\n🛠️: "+v,status:"pending"});
await set(push(ref(db,"notifications/"+cur.userId)),{title:"💬 Support Reply",message:"🛠️ Admin: "+v,read:false,createdAt:Date.now()});
window._lh();};
window._hc=async(id)=>{const cur=(await get(ref(db,"supportTickets/"+id))).val();
await update(ref(db,"supportTickets/"+id),{status:"closed"});
await set(push(ref(db,"notifications/"+cur.userId)),{title:"✅ Ticket Closed",message:"Ticket বন্ধ হয়েছে। ধন্যবাদ!",read:false,createdAt:Date.now()});
window._lh();};
onValue(ref(db,"supportTickets"),snap=>{
 const n=Object.values(snap.val()||{}).filter(x=>(x.subject||"").indexOf("HELP")===0&&x.status!=="closed").length;
 updateBell(n);
 if(ov.style.display==="block")window._lh();
});
</script>
