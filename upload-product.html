<title>Seller Panel</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDj_LLHWBgcKfQClnaOUqEtULHhP1vSVxw",
  authDomain: "mohajon-mjh.firebaseapp.com",
  databaseURL: "https://mohajon-mjh-default-rtdb.firebaseio.com",
  projectId: "mohajon-mjh",
  storageBucket: "mohajon-mjh.firebasestorage.app",
  messagingSenderId: "526105903976",
  appId: "1:526105903976:web:f9321c6d68ecbd19d58cdd"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.addProduct = async function(){

const bogoEnabled=document.getElementById("bogoEnabled")?document.getElementById("bogoEnabled").checked:false;
const bogoType=document.getElementById("bogoType")?document.getElementById("bogoType").value:"same";
const bogoFreeId=document.getElementById("bogoFreeId")?document.getElementById("bogoFreeId").value.trim():"";
const bogoMaxQty=document.getElementById("bogoMaxQty")?+document.getElementById("bogoMaxQty").value||1:1;
const bogoData=bogoEnabled?{enabled:true,type:bogoType,freeProductId:bogoFreeId||null,maxFreeQuantity:bogoMaxQty}:null;
const product = {
sellerId: window.USER_ID || "guest",
  id: Date.now(),
  name: document.getElementById('name').value,
  price: parseInt(document.getElementById('price').value),
  image: document.getElementById('image').value, colors: (window.__mjhAutoColor?window.__mjhAutoColor.label:''), colorImages: (window.__mjhAutoColor?(function(){var o={};o[window.__mjhAutoColor.label]=document.getElementById('image').value;return o;})():{}),
  weight: document.getElementById('weight').value,
  category: document.getElementById('category').value
, stock: parseInt(document.getElementById('stock').value||0),
bogo: bogoData
};

await push(ref(db,"products"), product);

alert("Product Added To Firebase");

};
</script>

<style>
body{font-family:Arial;background:#f5f5f5;padding:20px}

<h2>🛒 Seller Panel - Add Product</h2>

<div class="box">
<input id="name" placeholder="Product Name">
<input id="price" placeholder="Price">
<input id="stock" placeholder="Stock Quantity">
<input id="image" placeholder="Image URL (অথবা নিচে ছবি বাছুন)">
<input type="file" id="imageFile" accept="image/*">
<small id="imgStatus" style="color:#666">📷 ছবি বাছলেই Cloudinary-তে auto upload হবে</small>
<select id="weight">
<option>20g</option>
<option>50g</option>
<option>100g</option>
<option>250g</option>
<option>500g</option>
<option>1000g</option>
</select>
<select id="category">
<option>Electronics</option>
<option>Electronic Accessories</option>
<option>Computers</option>
<option>Mobile Phones</option>
<option>TV <option>মসলা</option> Appliances</option>
<option>Home <option>মসলা</option> Kitchen</option>
<option>Home <option>মসলা</option> Lifestyle</option>
<option>Grocery</option>
<option>Food <option>মসলা</option> Beverages</option>
<option>Health <option>মসলা</option> Beauty</option>
<option>Women Fashion</option>
<option>Men Fashion</option>
<option>Watches <option>মসলা</option> Bags</option>
<option>Mother <option>মসলা</option> Baby</option>
<option>Toys <option>মসলা</option> Games</option>
<option>Sports <option>মসলা</option> Outdoors</option>
<option>Automotive</option>
<option>Pet Supplies</option>
<option>Books</option>
<option>Stationery</option>
<option>Tools</option>
<option>Software</option>
<option>মসলা</option>
<option>গ্রোসারি</option>
<option>খাদ্য</option>
</select>


<h3 style="margin-top:20px;border-top:2px solid #f39c12;padding-top:14px">🎁 BOGO — Buy 1 Get 1 (Buy 1 Get 1 Free ক্যাটাগরিতে)</h3>
<label style="display:flex;gap:8px;align-items:center;margin:8px 0">
 <input type="checkbox" id="bogoEnabled"> Enable BOGO for this product
</label>
<div id="bogoOptions" style="display:none;padding:12px;background:#fff8e1;border-radius:8px;margin:8px 0">
 <label>Type:
  <select id="bogoType" style="margin-left:8px;padding:6px;border:1px solid #ddd;border-radius:6px">
   <option value="same">Same Product BOGO (Buy 1 → Same 1 Free)</option>
   <option value="specific">Specific Free Product</option>
  </select>
 </label>
 <div id="bogoSpecificWrap" style="display:none;margin-top:8px">
  <label>Free Product ID:
   <input id="bogoFreeId" placeholder="যেমন: phone-case-001" style="margin-left:8px;padding:6px;border:1px solid #ddd;border-radius:6px;width:200px">
  </label>
 </div>
 <label style="margin-top:8px;display:block">Max Free Quantity per paid unit:
  <input type="number" id="bogoMaxQty" value="1" min="1" max="10" style="margin-left:8px;padding:6px;border:1px solid #ddd;border-radius:6px;width:80px">
 </label>
</div>
<script>
(function(){
 var en=document.getElementById("bogoEnabled"),
     opts=document.getElementById("bogoOptions"),
     tp=document.getElementById("bogoType"),
     sw=document.getElementById("bogoSpecificWrap");
 if(!en)return;
 en.addEventListener("change",function(){opts.style.display=en.checked?"block":"none";});
 tp.addEventListener("change",function(){sw.style.display=tp.value==="specific"?"block":"none";});
})();
</script>
<button onclick="addProduct()">Add Product</button>
</div>


<script type="module">
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const auth=getAuth();

onAuthStateChanged(auth,(user)=>{
    if(!user){
        alert("Please login first.");
        location.href="index.html";
    }
});
</script>

<script>
document.getElementById("imageFile").addEventListener("change",async function(){var f=this.files[0];if(!f)return;var st=document.getElementById("imgStatus");if(!window.MJHCloud||!MJHCloud.ready()){st.textContent="⚠️ cloudinary.js-এ config বসান";return;}st.textContent="⏳ Cloudinary-তে upload হচ্ছে...";try{var r=await MJHCloud.upload(f);document.getElementById("image").value=r.url;st.textContent="✅ upload হয়েছে! 🎨 color detect হচ্ছে...";try{var dc=await new Promise(function(res){MJHColor.detectFromUrl(r.url,function(x){res(x);});});if(dc){window.__mjhAutoColor=dc;st.textContent="✅ upload হয়েছে! 🎨 Auto color: "+dc.label;}}catch(e2){}}catch(e){st.textContent="❌ "+e.message;}});
</script>
