<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Business Account - Mohajon-MJH</title>
<style>body{margin:0;font-family:Arial;background:#f4f6f8;color:#111}.top{background:#131921;color:#fff;padding:12px 16px;display:flex;align-items:center}.wrap{max-width:860px;margin:14px auto;padding:0 12px}.card{background:#fff;border-radius:10px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.08)}.big{font-size:22px;font-weight:900;color:#B12704}.btn{background:#FFD814;border:1px solid #FCD200;border-radius:18px;padding:9px 16px;font-weight:700;cursor:pointer;margin:3px}.btn.g{background:#232f3e;color:#fff}.inp{width:100%;padding:9px;margin:4px 0;border:1px solid #999;border-radius:7px;box-sizing:border-box;font-size:14px}.row{border-top:1px solid #eee;padding:9px 0;font-size:13px}.code{background:#111;color:#7CFC00;font-size:20px;font-weight:900;padding:10px 16px;border-radius:10px;display:inline-block;letter-spacing:2px}.step{background:#fff9e6;border-left:4px solid #FF9900;border-radius:6px;padding:10px;margin:6px 0;font-size:13px}.st{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700}.st.p{background:#ffe0b3;color:#8a5300}.st.a{background:#d4f4d4;color:#007600}.lbl{font-size:12px;font-weight:700;color:#565959}</style></head><body>
<div class="top"><b>🤝 Mohajon-MJH Business</b><a href="index.html" style="color:#fff;margin-left:auto;font-size:13px;text-decoration:none">🛍️ Shop</a></div>
<div class="wrap" id="content">লোড হচ্ছে...</div>
<div id="recaptcha"></div>
<script type="module">
import{initializeApp,getApps,getApp}from"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import{getAuth,onAuthStateChanged,RecaptchaVerifier,signInWithPhoneNumber}from"https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
import{getDatabase,ref,get,set,update,push,query,orderByChild,equalTo}from"https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";
const app=getApps().length?getApp():initializeApp({"apiKey":"AIzaSyDj_LLHWBgcKfQClnaOUqEtULHhP1vSVxw","authDomain":"mohajon-mjh.firebaseapp.com","databaseURL":"https://mohajon-mjh-default-rtdb.firebaseio.com","projectId":"mohajon-mjh","appId":"1:526105903976:web:f9321c6d68ecbd19d58cdd"});
const auth=getAuth(app),db=getDatabase(app);
const fmt=v=>"৳"+Number(v||0).toFixed(2);
let uid=null,prof=null,phoneVerified=false,verif=null,prods={};
const pickId=new URLSearchParams(location.search).get("product");
const GUIDE=`<div class="card"><div class="big">💼 যেভাবে Business Account চালু করবেন</div>
<div class="step">1️⃣ Gmail/Phone verify করে Business Account তৈরি করুন (নিচের ফর্ম)</div>
<div class="step">2️⃣ আপনার  ID Code পাবেন — এটাই আপনার পরিচয়</div>
<div class="step">3️⃣ Admin আপনার code approve করবে</div>
<div class="step">4️⃣ পছন্দের পণ্য Select করে "Add to My Account" চাপুন</div>
<div class="step">5️⃣ Admin approve করলেই WhatsApp/Facebook-এ লিংক share করুন</div>
<div class="step">6️⃣ আপনার লিংকে কেউ কিনলেই 💰 commission আপনার wallet-এ auto যোগ হবে</div></div>`;
onAuthStateChanged(auth,async u=>{
 if(!u||u.isAnonymous){document.getElementById("content").innerHTML=`<div class="card"><div class="big">🔐 Login দরকার</div><p style="font-size:13px">Gmail বা Phone verify করে Business Account খুলুন।</p><button class="btn" onclick="location.href='login.html'">🌎 Sign in / Create account</button></div>`;return;}
 uid=u.uid;
 try{const p=await get(ref(db,"affiliates/"+uid));prof=p.val();}catch(e){}
 try{const pp=await get(query(ref(db,"products"),orderByChild("status"),equalTo("active")));prods=pp.val()||{};}catch(e){}
 render();
});
function render(){
 const c=document.getElementById("content");
 if(!prof){c.innerHTML=GUIDE+`<div class="card"><div class="big">📝 Business Account Form (বায়োডাটা)</div>
 <div class="lbl">পূর্ণ নাম *</div><input class="inp" id="bName">
 <div class="lbl">Email *</div><input class="inp" id="bEmail" value="${auth.currentUser.email||""}">
 <div class="lbl">মোবাইল নাম্বার * (OTP verify হবে)</div><div style="display:flex;gap:6px"><input class="inp" id="bPhone" placeholder="+8801XXXXXXXXX"><button class="btn g" id="otpBtn" onclick="window.sendOtp()">📩 OTP পাঠান</button></div>
 <div class="lbl">ঠিকানা *</div><input class="inp" id="bAddr">
 <div class="lbl">NID/পাসপোর্ট নম্বর (ঐচ্ছিক)</div><input class="inp" id="bNid">
 <div class="lbl">📱 bKash নম্বর (যদি থাকে)</div><input class="inp" id="bBkash"><div class="lbl">📱 Nagad নম্বর</div><input class="inp" id="bNagad"><div class="lbl">📱 Rocket নম্বর</div><input class="inp" id="bRocket">
 <div class="lbl">🏦 Account holder নাম *</div><input class="inp" id="bAccName" placeholder="যেমন: Jahanara Hossain">
 <div class="lbl">🏦 ব্যাংক নাম *</div><input class="inp" id="bBankName" placeholder="যেমন: Sonali Bank">
 <div class="lbl">🏦 Account নম্বর *</div><input class="inp" id="bAccNum" placeholder="Account number">
 <div class="lbl">🏦 Branch নাম</div><input class="inp" id="bBranch" placeholder="যেমন: Yanbu Branch">
 <div class="lbl">Facebook/Social link</div><input class="inp" id="bFb">
 <button class="btn" style="width:100%;margin-top:10px" onclick="window.createAcc()">✅ Business Account তৈরি করুন</button></div>`;return;}
 let detailHtml="";if(pickId&&prods[pickId]){const pp=prods[pickId];detailHtml='<div class="card"><h3>🛍️ পণ্য Details</h3>'+(pp.images&&pp.images.main?'<img src="'+pp.images.main+'" style="width:100%;border-radius:8px">':'')+'<h2>'+pp.title+'</h2><div style="font-size:20px;color:#B12704;font-weight:900">৳'+pp.price+'</div>'+(pp.discountPercent?'<p><span class="st a">🔥 -'+pp.discountPercent+'% discount</span></p>':'')+(pp.startDate?'<p style="font-size:12px">🗓️ Offer: '+pp.startDate+' → '+(pp.endDate||'')+'</p>':'')+'<p style="font-size:13px">'+(pp.description||'')+'</p><button class="btn" style="width:100%" onclick="window.addProd(\''+pickId+'\')">➕ Add to My Account</button></div>';}
const st=prof.status==="approved"?'<span class="st a">✅ Approved</span>':'<span class="st p">⏳ Admin approval pending</span>';
 let myProds=Object.entries(prof.products||{}).map(([pid,p])=>{const link="https://mohajon-mjh.github.io/product.html?id="+pid+"&ref="+uid;
  return `<div class="row"><b>${p.title}</b> — ${fmt(p.price)}<br>🆔 ${p.code} ${p.status==="approved"?'<span class="st a">✅ Live</span>':'<span class="st p">⏳ Pending</span>'} ${p.rate?`| 💰 ${p.rate}%`:''}<br>${p.status==="approved"?`<a class="btn" target="_blank" href="https://wa.me/?text=${encodeURIComponent("🛍️ "+p.title+" কিনুন: "+link)}">📲 WhatsApp</a><a class="btn" target="_blank" href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(link)}">📘 Facebook</a><a class="btn" target="_blank" href="https://twitter.com/intent/tweet?text=${encodeURIComponent("🛍️ "+p.title)}&url=${encodeURIComponent(link)}">🐦 Twitter</a><a class="btn" target="_blank" href="https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(link)}">💼 LinkedIn</a><button class="btn" onclick="navigator.clipboard.writeText('${link}');this.textContent='✅ Copied → YouTube'">▶️ YouTube</button><button class="btn" onclick="navigator.clipboard.writeText('${link}');this.textContent='✅ Copied → TikTok'">🎵 TikTok</button><button class="btn" onclick="navigator.clipboard.writeText('${link}');this.textContent='✅ Copied → Instagram'">📸 Instagram</button><button class="btn" onclick="navigator.clipboard.writeText('${link}');this.textContent='✅ Copied'">🔗 Copy</button>`:'<small>Admin approve করলে share button চালু হবে</small>'}</div>`;}).join("");
 let msgs=Object.values(prof.messages||{}).sort((a,b)=>a.time-b.time).map(m=>`<div class="row" style="background:${m.from==="admin"?"#e8f4fd":"#f0fff0"};border-radius:6px;padding:8px"><b>${m.from==="admin"?"🛠️ Admin":" আপনি"}:</b> ${m.text}</div>`).join("");
 c.innerHTML=`<div class="card"><div class="big">🤝 আমার Business Account</div><p>আপনার 🆔 পরিচিতি কোড:</p><div class="code">${prof.code}</div> <button class="btn" onclick="navigator.clipboard.writeText('${prof.code}')">📋 Copy</button><br><br>Status: ${st}</div>
 ${detailHtml}
 ${GUIDE}
 <div class="card"><h3>🛍️ পণ্য Select করুন</h3><p style="font-size:13px">Homepage থেকে যেকোনো পণ্যে click করে আপনার account-এ যোগ করুন।</p><button class="btn" style="width:100%" onclick="localStorage.setItem('pickMode','1');location.href='index.html'">🛍️ পণ্য Select করুন →</button></div>
 <div class="card"><h3>📦 আমার পণ্য ও Share</h3>${myProds||"এখনো পণ্য যোগ করেননি"}</div>
 <div class="card"><h3>💰 আমার আয়</h3><div id="earn">লোড হচ্ছে...</div></div>
 ${prof.status==="approved"?`<div class="card"><h3>💬 Admin-এর সাথে Message</h3>${msgs}<div style="display:flex;gap:6px;margin-top:8px"><input class="inp" id="msgTxt" placeholder="Message লিখুন"><button class="btn" onclick="window.sendMsg()">📨</button></div></div>`:`<div class="card">❌ শুধুমাত্র approved member-রা message করতে পারবে</div>`}`;
 loadEarn();
}
window.sendOtp=async()=>{const ph=document.getElementById("bPhone").value.trim();if(!/^\+?[0-9]{11,15}$/.test(ph))return alert("সঠিক নম্বর দিন");
 if(!window.__rv){window.__rv=new RecaptchaVerifier(auth,"recaptcha",{size:"invisible"});}
 try{verif=await signInWithPhoneNumber(auth,ph,window.__rv);const code=prompt("📩 OTP কোড দিন:");if(code){await verif.confirm(code);phoneVerified=true;alert("✅ Phone verified!");document.getElementById("otpBtn").textContent="✅ Verified";}}catch(e){if((e.code||"").indexOf("billing")>-1){phoneVerified=false;alert("⚠️ OTP service unavailable (Firebase free plan)। Phone verify ছাড়াই account তৈরি হবে — admin পরে verify করবে।");document.getElementById("otpBtn").textContent="⏭️ Skip";}else{alert("❌ "+e.message);}}};
window.createAcc=async()=>{const g=id=>document.getElementById(id).value.trim();
 if(!g("bName")||!g("bPhone")||!g("bAddr"))return alert("নাম, ফোন, ঠিকানা আবশ্যক");
 if(!g("bBkash")&&!g("bAccNum"))return alert("bKash অথবা ব্যাংক account নম্বর দিন");
 const code="MJH-"+uid.slice(-6).toUpperCase();
 await set(ref(db,"affiliates/"+uid),{uid,code,name:g("bName"),email:g("bEmail"),phone:g("bPhone"),phoneVerified,address:g("bAddr"),nid:g("bNid"),bkash:g("bBkash"),nagad:g("bNagad"),rocket:g("bRocket"),bank:(g("bAccName")||g("bAccNum")?("Name: "+g("bAccName")+" | Bank: "+g("bBankName")+" | A/C: "+g("bAccNum")+" | Branch: "+g("bBranch")):""),fb:g("bFb"),status:"pending",createdAt:Date.now(),products:{},messages:{}});
 alert("✅ Account তৈরি! আপনার 🆔 কোড: "+code+" — Admin approve করলেই শুরু করতে পারবেন");
 const p=await get(ref(db,"affiliates/"+uid));prof=p.val();render();};
window.addProd=async(id)=>{const p=prods[id];if(!p)return;
 await update(ref(db,"affiliates/"+uid+"/products/"+id),{title:p.title,price:p.price,img:(p.images&&p.images.main)||null,code:prof.code+"-"+id.slice(-4).toUpperCase(),status:"pending",addedAt:Date.now()});
 alert("✅ যোগ হয়েছে! Admin approve করলে share button পাবেন। 🆔 Product code: "+prof.code+"-"+id.slice(-4).toUpperCase());
 const q=await get(ref(db,"affiliates/"+uid));prof=q.val();render();};
window.sendMsg=async()=>{const t=document.getElementById("msgTxt").value.trim();if(!t)return;
 await push(ref(db,"affiliates/"+uid+"/messages"),{from:"affiliate",text:t,time:Date.now()});
 const q=await get(ref(db,"affiliates/"+uid));prof=q.val();render();};
async function loadEarn(){
 let bal=0,rows="";
 try{const w=await get(ref(db,"wallets/"+uid));bal=(w.val()&&w.val().balance)||0;}catch(e){}
 try{const t=await get(query(ref(db,"transactions"),orderByChild("userId"),equalTo(uid)));
  rows=Object.values(t.val()||{}).map(x=>`<div class="row">${x.type==="credit"?"🟢 +":"🔴 −"}${fmt(x.amount)} — ${x.reason||x.type}</div>`).join("");}catch(e){}
 document.getElementById("earn").innerHTML=`<div class="code" style="background:#007600">Balance: ${fmt(bal)}</div>`+rows;
}
</script></body></html>
