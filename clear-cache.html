<!DOCTYPE html>
<html>
<head><title>Clear Cache - MJH</title></head>
<body style="font-family:sans-serif;padding:20px;background:#1a1a1a;color:#fff">
<h2>🧹 Cache Cleaning...</h2>
<div id="status"></div>
<script>
const status = document.getElementById('status');
let steps = [];

// Unregister service workers
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(registrations => {
    registrations.forEach(reg => {
      reg.unregister();
      steps.push('✅ Unregistered: ' + reg.scope);
    });
    status.innerHTML = steps.join('<br>');
  });
}

// Clear all caches
if ('caches' in window) {
  caches.keys().then(names => {
    names.forEach(name => {
      caches.delete(name);
      steps.push('✅ Deleted cache: ' + name);
    });
    status.innerHTML = steps.join('<br>');
    status.innerHTML += '<h3 style="margin-top:30px">🎉 All cleared!</h3>';
    status.innerHTML += '<p><a href="/" style="font-size:20px;color:#4CAF50">← Go to homepage (fresh load)</a></p>';
  });
}
</script>
</body>
</html>
