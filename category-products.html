<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>প্রোডাক্ট ম্যানেজার v9</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="cloudinary.js"></script>
<style>
body{margin:0;background:#121212;color:#fff;font-family:sans-serif}
.box{background:#252525;padding:12px;border-bottom:1px solid #444}
label{display:block;font-size:12px;color:#bbb;margin:4px 0}
input{width:100%;padding:8px;background:#333;border:1px solid #555;color:#fff;border-radius:4px;box-sizing:border-box}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{border:none;border-radius:4px;padding:8px 12px;font-weight:700;cursor:pointer}
.save{background:#2ecc71;color:#000}.del{background:#e74c3c;color:#fff}.edit{background:#f1c40f;color:#000}
.card{background:#2a2a2a;border-left:4px solid #3498db;border-radius:6px;padding:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
#authwarn{display:none;background:#e74c3c;color:#fff;padding:8px 12px;font-size:13px}
</style>
</head>
<body>
<div style="display:flex;justify-content:space-between;align-items:center;padding:12px;background:#1e1e1e;border-bottom:1px solid #333">
<h2 style="margin:0;font-size:18px">📦 <span id="head">প্রোডাক্ট ম্যানেজার</span></h2>
<span id="status-msg" style="font-size:12px;color:#aaa">Ready</span>
</div>
<div id="authwarn">⚠️ Admin login পাওয়া যায়নি — Save/Delete কাজ করবে না। <a href="login.html" style="color:#fff">লগইন করুন</a></div>
<div class="box">
<h3 style="margin:0 0 8px;color:#f39c12">➕ Add / Update Product</h3>
<form id="prod-form">
<input type="hidden" id="edit-id">
<div class="grid">
<div><label>Product Name *</label><input id="p-name" required placeholder="e.g. Samsung Galaxy A04"></div>
<div><label>Price (৳) *</label><input id="p-price" type="number" step="0.01" required></div>
<div><label>Discount (%)</label><input id="p-disc" type="number" min="0" max="100" value="0"></div>
<div><label>Stock</label><input id="p-stock" type="number" value="10"></div>
<div><label>Start Date</label><input id="p-start" type="date"></div>
<div><label>End Date</label><input id="p-end" type="date"></div>
</div>
<label>Image (Cloudinary)</label>
<input id="p-img" type="file" accept="image/*">
<img id="img-preview" style="max-width:90px;display:none;margin-top:6px;border-radius:4px">
<button class="save" type="submit" id="save-btn" style="width:100%;margin-top:10px;padding:12px">💾 SAVE & SYNC TO ALL SECTIONS</button>
</form>
</div>
<div style="padding:12px">
<h3 style="margin:0 0 8px">Products (<span id="cat-display"></span>)</h3>
<div id="list-container"><p style="color:#888">তালিকা আনা হচ্ছে...</p></div>
</div>
<script>
var CFG={apiKey:"AIzaSyDj_LLHWBgcKfQClnaOUqEtULHhP1vSVxw",authDomain:"mohajon-mjh.firebaseapp.com",databaseURL:"https://mohajon-mjh-default-rtdb.firebaseio.com",projectId:"mohajon-mjh",storageBucket:"mohajon-mjh.appspot.com",messagingSenderId:"000000000000",appId:"1:000000000000:web:0000"};
if(!firebase.apps.length)firebase.initializeApp(CFG);
var db=firebase.database(),auth=firebase.auth();
var params=new URLSearchParams(location.search);
var SEC=params.get("sec")||"settings/globalCategoryProducts";
var CAT=params.get("cat")||"";
var SECTIONS=[
{cats:"settings/flashSaleCategories",prods:"settings/flashSaleCategoryProducts"},
{cats:"settings/dealsOfDayCategories",prods:"settings/dealsOfDayCategoryProducts"},
{cats:"settings/specialCategories",prods:"settings/specialCategoryProducts"},
{cats:"settings/globalCategories",prods:"settings/globalCategoryProducts"}
];
document.getElementById("cat-display").textContent=CAT||"General";
document.getElementById("head").textContent=(CAT||"Product")+" — প্রোডাক্ট ম্যানেজার";
auth.onAuthStateChanged(function(u){document.getElementById("authwarn").style.display=u?"none":"block";});
function setStatus(m,c){var e=document.getElementById("status-msg");e.textContent=m;e.style.color=c||"#aaa";}
function norm(s){return (s||"").toLowerCase();}
function matches(prodName,catName){var a=norm(prodName),b=norm(catName);if(!b||b.length<3)return false;if(a.indexOf(b)>=0||b.indexOf(a)>=0)return true;var t=a.split(/[\s\-]+/);for(var i=0;i<t.length;i++){if(t[i].length>3&&b.indexOf(t[i])>=0)return true;}return false;}
document.getElementById("p-img").addEventListener("change",function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(e){var im=document.getElementById("img-preview");im.src=e.target.result;im.style.display="block";};r.readAsDataURL(f);});
document.getElementById("prod-form").addEventListener("submit",function(ev){ev.preventDefault();handleSmartSave();});
function curPath(){return SEC+(CAT?"/"+CAT:"");}
async function loadList(){
var c=document.getElementById("list-container");c.innerHTML='<p style="color:#888">তালিকা আনা হচ্ছে...</p>';
try{
var snap=await db.ref(curPath()).once("value");var data=snap.val()||{};var keys=Object.keys(data);
if(!keys.length){c.innerHTML='<p style="color:#888">এই সেকশনে এখনো কোনো প্রোডাক্ট নেই। উপরের ফর্ম থেকে যোগ করুন।</p>';return;}
var html="";
keys.forEach(function(k){var p=data[k]||{};
var fp=p.price?Math.round(p.price*(1-(p.discount||0)/100)):"?";
html+='<div class="card"><div style="flex:1"><strong>'+(p.name||"Unnamed")+'</strong><br><small style="color:#aaa">৳'+(p.price||0)+' (-'+(p.discount||0)+'%) → <b style="color:#2ecc71">৳'+fp+'</b> | Stock: '+(p.stock||0)+'</small><br><small style="color:#666">'+k+'</small></div><div style="display:flex;gap:6px"><button class="edit" onclick="prepareEdit(\''+k+'\')">Edit</button><button class="del" onclick="deleteProd(\''+k+'\')">Del</button></div></div>';});
c.innerHTML=html;
}catch(e){c.innerHTML='<p style="color:#e74c3c">Error: '+e.message+'</p>';}
}
window.prepareEdit=async function(id){
var snap=await db.ref(curPath()+"/"+id).once("value");var p=snap.val();if(!p)return alert("Not found");
document.getElementById("edit-id").value=id;
document.getElementById("p-name").value=p.name||"";
document.getElementById("p-price").value=p.price||"";
document.getElementById("p-disc").value=p.discount||0;
document.getElementById("p-stock").value=p.stock||0;
document.getElementById("p-start").value=p.startDate||"";
document.getElementById("p-end").value=p.endDate||"";
window.scrollTo(0,0);setStatus("Editing: "+id,"#f1c40f");
};
window.deleteProd=async function(id){
if(!confirm("সব সেকশন থেকে ডিলিট হবে। নিশ্চিত?"))return;
setStatus("Deleting...","#f39c12");
try{
var up={};up[curPath()+"/"+id]=null;
for(var i=0;i<SECTIONS.length;i++){
var snap=await db.ref(SECTIONS[i].prods).once("value");var all=snap.val()||{};
Object.keys(all).forEach(function(catId){var items=all[catId]||{};if(items[id]||(items[id]&&items[id].id===id))up[SECTIONS[i].prods+"/"+catId+"/"+id]=null;});
}
await db.ref().update(up);
setStatus("Deleted","#2ecc71");loadList();
}catch(e){alert("❌ "+e.message);setStatus("Error","#e74c3c");}
};
async function handleSmartSave(){
var btn=document.getElementById("save-btn");var ot=btn.textContent;btn.disabled=true;btn.textContent="⏳ Processing...";
setStatus("Saving...","#f39c12");
var editId=document.getElementById("edit-id").value;
var name=document.getElementById("p-name").value.trim();
var price=parseFloat(document.getElementById("p-price").value);
var disc=parseInt(document.getElementById("p-disc").value)||0;
var stock=parseInt(document.getElementById("p-stock").value)||0;
var start=document.getElementById("p-start").value;
var end=document.getElementById("p-end").value;
var imgFile=document.getElementById("p-img").files[0];
if(!name||isNaN(price)){alert("Name ও Price আবশ্যক!");btn.disabled=false;btn.textContent=ot;return;}
var newId=editId||("p_"+Date.now());
try{
var imageUrl="";
if(editId&&!imgFile){var es=await db.ref(curPath()+"/"+editId).once("value");if(es.exists())imageUrl=es.val().image||"";}
if(imgFile){
setStatus("Cloudinary upload...","#3498db");
if(!window.MJHCloud)throw new Error("cloudinary.js লোড হয়নি");
var res=await window.MJHCloud.upload(imgFile);imageUrl=res.url;
}
var prodData={id:newId,name:name,price:price,discount:disc,stock:stock,startDate:start,endDate:end,image:imageUrl,updatedAt:firebase.database.ServerValue.TIMESTAMP};
var up={};up[curPath()+"/"+newId]=prodData;var syncCount=1;
for(var i=0;i<SECTIONS.length;i++){
var cs=await db.ref(SECTIONS[i].cats).once("value");var cats=cs.val()||{};
Object.keys(cats).forEach(function(catId){
var cn=cats[catId]&&(cats[catId].name||cats[catId].title||cats[catId].label||"");
if(matches(name,cn)){up[SECTIONS[i].prods+"/"+catId+"/"+newId]=prodData;syncCount++;}
});
}
await db.ref().update(up);
setStatus("Saved + synced "+syncCount+" জায়গায়","#2ecc71");
alert("✅ সেভ হয়েছে!\nমোট "+syncCount+" জায়গায় সিঙ্ক হয়েছে (বর্তমান সেকশন + নাম মিলে যাওয়া ক্যাটাগরি)।");
document.getElementById("prod-form").reset();document.getElementById("edit-id").value="";document.getElementById("img-preview").style.display="none";
loadList();
}catch(e){alert("❌ "+e.message);setStatus("Error","#e74c3c");}
finally{btn.disabled=false;btn.textContent=ot;}
}
loadList();
</script>
</body>
</html>
