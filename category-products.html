<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>প্রোডাক্ট ম্যানেজার v18</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="cloudinary.js"></script>
<style>
body{margin:0;background:#121212;color:#fff;font-family:sans-serif;font-size:14px}
.hdr{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#1e1e1e;border-bottom:1px solid #333}
.zone{padding:10px 12px;background:#1b1b1b;margin:10px 12px;border-radius:8px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
button{border:none;border-radius:6px;padding:9px 12px;font-weight:700;cursor:pointer;font-size:12px}
.blue{background:#3498db;color:#fff}.save{background:#2ecc71;color:#000}.del{background:#e74c3c;color:#fff}
input,textarea{padding:8px;background:#222;border:1px solid #444;color:#fff;border-radius:4px;box-sizing:border-box;width:100%}
.lb{display:block;font-size:12px;color:#bbb;margin:8px 0 3px}
.card{background:#1e1e1e;border:1px solid #333;border-radius:8px;margin:12px;padding:12px}
.chead{display:flex;gap:8px;align-items:center}
.chead img{width:60px;height:60px;object-fit:cover;border-radius:6px;background:#333;cursor:pointer}
.curline{background:#222;border-radius:4px;padding:6px 8px;margin-top:6px;font-size:13px}
.auto{color:#2ecc71;font-weight:700}
s{color:#888}
#searchbar,#uploadzone{display:none}
#searchres{max-height:180px;overflow:auto;background:#1b1b1b;border:1px solid #444;border-radius:6px;margin:6px 12px;display:none}
.sr{display:flex;justify-content:space-between;gap:6px;padding:6px 8px;border-bottom:1px solid #2c2c2c;font-size:12px}
#authwarn{display:none;background:#e74c3c;padding:8px 12px;font-size:12px}
#pathinfo{font-size:10px;color:#666;padding:4px 12px;background:#161616}
</style>
</head>
<body>
<div class="hdr"><h2 style="margin:0;font-size:16px">🛍️ 🏆 <span id="head"></span></h2><span id="status-msg" style="font-size:11px;color:#aaa">Ready</span></div>
<div id="pathinfo"></div>
<div id="authwarn">⚠️ Admin login নেই — Save কাজ করবে না। <a href="login.html" style="color:#fff">লগইন</a></div>
<div style="padding:0 12px">
<div class="btnrow">
<button class="blue" onclick="hideSelected()">🛍️ প্রোডাক্ট হাইড</button>
<button class="blue" onclick="toggleZone()">➕ নতুন প্রোডাক্ট এড</button>
</div>
<div class="btnrow">
<button class="blue" onclick="ALLMODE=false;loadList()">📦 এই ক্যাটাগরি লোড</button>
<button class="blue" onclick="ALLMODE=true;loadList()">📁 All Products</button>
<button class="blue" onclick="toggleSearch()">🔍 Search Products</button>
</div>
</div>
<div id="searchbar" style="padding:0 12px">
<div class="btnrow"><input type="text" id="q" placeholder="🔍 পণ্যের নাম লিখে সার্চ দিন"><button class="blue" onclick="doSearch()">সার্চ</button></div>
</div>
<div id="searchres"></div>
<div id="uploadzone" class="zone">
<p style="font-size:12px;color:#bbb;margin:0 0 6px">গ্যালারি/স্টোরেজ থেকে একাধিক ছবি সিলেক্ট করুন</p>
<input type="file" id="bulkimg" accept="image/*" multiple>
</div>
<div class="zone">
<label style="display:flex;gap:6px;align-items:center;font-size:13px"><input type="checkbox" id="markall" onchange="markAll(this)" style="width:auto"> সব সিলেক্ট করুন</label>
<div class="btnrow">
<button class="save" onclick="saveSelected()">💾 সিলেক্টেড সব Save</button>
<button class="del" onclick="deleteSelected()">🗑 সিলেক্টেড ডিলিট</button>
</div>
<div class="btnrow">
<input type="number" id="bpct" placeholder="%" style="width:80px">
<button class="save" onclick="applyDisc()">✅ সিলেক্টেড % কমান</button>
</div>
<div class="btnrow">
<input type="date" id="bstart" style="width:140px">
<input type="date" id="bend" style="width:140px">
<button class="blue" onclick="applyDates()">📅 সিলেক্টেডে তারিখ বসান</button>
</div>
<label class="lb">প্রাইস লিস্ট পেস্ট করুন (প্রতি লাইনে: নাম — দাম)</label>
<textarea id="bulktext" rows="4" placeholder="Barbeque Masala 100GM - ৳150"></textarea>
<div class="btnrow"><button class="blue" onclick="priceList()">✅ প্রাইস বসান (নাম মিলিয়ে)</button><span id="pricemsg" style="font-size:12px;color:#2ecc71"></span></div>
</div>
<div id="list-container"><p style="text-align:center;color:#888">লোড হচ্ছে...</p></div>
<div id="lightbox" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:998" onclick="this.style.display='none'"><img id="lbimg" style="max-width:95%;max-height:88%;margin:0 auto;display:block;padding-top:6vh"></div>
<script>
var CFG={apiKey:"AIzaSyDj_LLHWBgcKfQClnaOUqEtULHhP1vSVxw",authDomain:"mohajon-mjh.firebaseapp.com",databaseURL:"https://mohajon-mjh-default-rtdb.firebaseio.com",projectId:"mohajon-mjh",storageBucket:"mohajon-mjh.appspot.com",messagingSenderId:"000000000000",appId:"1:000000000000:web:0000"};
if(!firebase.apps.length)firebase.initializeApp(CFG);
var db=firebase.database(),auth=firebase.auth();
var RT="https://mohajon-mjh-default-rtdb.firebaseio.com/";
var MASTER="products";
var params=new URLSearchParams(location.search);
var SEC=params.get("sec")||"";
var CAT=params.get("cat")||"";
var ALLMODE=false,BASEPATH="";
var SECTIONS=[
{cats:"settings/megaCategories",prods:"settings/megaCategoryProducts"},
{cats:"settings/flashSaleCategories",prods:"settings/flashSaleCategoryProducts"},
{cats:"settings/globalCategories",prods:"settings/globalCategoryProducts"},
{cats:"settings/dealsOfDayCategories",prods:"settings/dealsOfDayCategoryProducts"},
{cats:"settings/everydayLowPriceCategories",prods:"settings/everydayLowPriceCategoryProducts"},
{cats:"settings/clearanceOutletCategories",prods:"settings/clearanceOutletCategoryProducts"},
{cats:"settings/comboOffersCategories",prods:"settings/comboOffersCategoryProducts"},
{cats:"settings/specialCategories",prods:"settings/specialCategoryProducts"}
];
var G={
name:["name","title","n","label"],
price:["price","p","mrp","marketPrice","salePrice"],
discount:["discount","disc","off","discountPercent"],
originalPrice:["originalPrice","discountPrice","oldPrice"],
stock:["stock","stk","qty","quantity"],
startDate:["startDate","start","from","offerStart"],
endDate:["endDate","end","to","offerEnd"],
image:["image","img","photo","picture"]
};
var P={};
document.getElementById("head").textContent=(CAT||"Product")+" — প্রোডাক্ট ম্যানেজার";
auth.onAuthStateChanged(function(u){document.getElementById("authwarn").style.display=u?"none":"block";});
function st(m,c){var e=document.getElementById("status-msg");e.textContent=m;e.style.color=c||"#aaa";}
function norm(s){return (s||"").toLowerCase();}
function nkey(s){return (s||"").toLowerCase().replace(/[_\-]+/g," ").replace(/\s+/g," ").trim();}
function toks(s){return nkey(s).replace(/,/g,"").split(/\s+/).sort().join(" ");}
function matches(a,b){a=norm(a);b=norm(b);if(!b||b.length<3)return false;if(a.indexOf(b)>=0||b.indexOf(a)>=0)return true;var t=a.split(/[\s\-]+/);for(var i=0;i<t.length;i++){if(t[i].length>3&&b.indexOf(t[i])>=0)return true;}return false;}
function gv(p,f){var ks=G[f]||[f];for(var i=0;i<ks.length;i++){if(p[ks[i]]!==undefined&&p[ks[i]]!==null&&p[ks[i]]!=="")return p[ks[i]];}
if(f==="image"&&p.images&&p.images.main)return p.images.main;return "";}
async function restShallow(path){
try{var r=await fetch(RT+path+".json?shallow=true");return await r.json();}catch(e){return null;}
}
async function detectBase(){
if(SEC){var s=await restShallow(SEC+(CAT?"/"+CAT:""));if(s&&typeof s==="object"&&Object.keys(s).length){BASEPATH=SEC;return;}}
for(var i=0;i<SECTIONS.length;i++){
var s2=await restShallow(SECTIONS[i].prods+(CAT?"/"+CAT:""));
if(s2&&typeof s2==="object"&&Object.keys(s2).length){BASEPATH=SECTIONS[i].prods;return;}
}
var cs=await restShallow("settings/customSectionProducts");
if(cs){for(var sec in cs){var s3=await restShallow("settings/customSectionProducts/"+sec+(CAT?"/"+CAT:""));if(s3&&typeof s3==="object"&&Object.keys(s3).length){BASEPATH="settings/customSectionProducts/"+sec;return;}}}
BASEPATH=SEC||"settings/globalCategoryProducts";
}
function cp(){return BASEPATH+(CAT?"/"+CAT:"");}
function checkedEls(){return document.querySelectorAll(".sel:checked");}
function toggleZone(){var z=document.getElementById("uploadzone");z.style.display=z.style.display==="block"?"none":"block";}
function toggleSearch(){var z=document.getElementById("searchbar");z.style.display=z.style.display==="block"?"none":"block";}
window.showLB=function(s){if(!s)return;document.getElementById("lbimg").src=s;document.getElementById("lightbox").style.display="block";};
async function mergeMaster(id,mapEntry){
var m=await db.ref(MASTER+"/"+id).once("value");
var mv=m.val()||{};
return Object.assign({},mapEntry||{},mv,{_path:cp(),_map:mapEntry||{}});
}
async function loadList(){
var c=document.getElementById("list-container");c.innerHTML='<p style="text-align:center;color:#888">লোড হচ্ছে...</p>';
P={};
if(!BASEPATH)await detectBase();
document.getElementById("pathinfo").textContent="📂 পাথ: "+cp()+" | মাস্টার: products/<id>";
try{
var base=ALLMODE?BASEPATH:cp();
var s=await db.ref(base).once("value");var all=s.val()||{};
if(ALLMODE){
for(var catId in all){var items=all[catId]||{};
for(var id in items){var mm=await mergeMaster(id,items[id])||{};mm._path=BASEPATH+"/"+catId;P[id]=mm;}}
}else{
for(var id2 in all){var m3=await mergeMaster(id2,all[id2])||{};m3._path=cp();P[id2]=m3;}
}
render();
}catch(e){c.innerHTML='<p style="color:#e74c3c">Error: '+e.message+'</p>';}
}
function sortedKeys(){return Object.keys(P).sort(function(a,b){return (P[b].createdAt||P[b].addedAt||P[b].updatedAt||0)-(P[a].createdAt||P[a].addedAt||P[a].updatedAt||0);});}
function curOf(p){var d=parseFloat(gv(p,"discount"))||0;var pr=parseFloat(gv(p,"price"))||0;return d>0?Math.round(pr*(1-d/100)):pr;}
function curlineHTML(p){var pr=parseFloat(gv(p,"price"))||0,d=parseFloat(gv(p,"discount"))||0,cu=curOf(p);
if(d>0)return '<s>৳'+pr+'</s> → <b class="auto">৳'+cu+'</b> <span style="color:#f39c12">(Save ৳'+(pr-cu)+')</span>';
return '৳'+pr+' <span style="color:#888">(কোনো ডিসকাউন্ট নেই)</span>';}
function render(){
var c=document.getElementById("list-container");var ks=sortedKeys();
if(!ks.length){c.innerHTML='<p style="text-align:center;color:#888">কোনো পণ্য নেই। ➕ নতুন প্রোডাক্ট এড → ছবি বাছুন।</p>';return;}
var h="";ks.forEach(function(id){h+=card(id,P[id]||{});});c.innerHTML=h;
}
function card(id,p){
var esc=function(s){return (s===undefined||s===null)?"":String(s).replace(/"/g,"&quot;");};
var img=gv(p,"image");
var inactive=p.status&&p.status!=="active";
var h='<div class="card" data-id="'+id+'" data-path="'+(p._path||cp())+'">';
h+='<div class="chead"><img src="'+esc(img)+'" onerror="this.style.visibility=\'hidden\'" onclick="showLB(this.src)">';
h+='<input type="checkbox" class="sel" value="'+id+'" style="width:auto">';
h+='<b style="flex:1">'+esc(gv(p,"name")||"Unnamed")+(inactive?' <span style="color:#e74c3c">(Hidden)</span>':'')+'</b></div>';
h+='<label class="lb">নাম</label><input class="ci" data-f="name" value="'+esc(gv(p,"name"))+'">';
h+='<label class="lb">মূল দাম / Market Price (৳)</label><input class="ci" data-f="price" type="number" value="'+(parseFloat(gv(p,"price"))||0)+'">';
h+='<label class="lb">Discount %</label><input class="ci" data-f="discount" type="number" value="'+(parseFloat(gv(p,"discount"))||0)+'" style="width:100px">';
h+='<label class="lb">বর্তমান দাম (৳) — অটো</label><input class="ci auto" data-f="_cur" readonly value="'+curOf(p)+'">';
h+='<div class="curline">'+curlineHTML(p)+'</div>';
h+='<label class="lb">অরিজিনাল দাম (কাটা দেখাবে)</label><input class="ci" data-f="originalPrice" type="number" value="'+(parseFloat(gv(p,"originalPrice"))||0)+'">';
h+='<label class="lb">Offer শুরুর তারিখ</label><input class="ci" data-f="startDate" type="date" value="'+esc(gv(p,"startDate"))+'">';
h+='<label class="lb">Offer শেষের তারিখ</label><input class="ci" data-f="endDate" type="date" value="'+esc(gv(p,"endDate"))+'">';
h+='<label class="lb">স্টক</label><input class="ci" data-f="stock" type="number" value="'+(parseFloat(gv(p,"stock"))||0)+'" style="width:120px">';
h+='<div class="btnrow" style="margin-top:6px"><input type="file" id="img_'+id+'" accept="image/*" style="flex:1;background:#222"><button class="blue" onclick="uploadImg(\''+id+'\')">📷 চেঞ্জ</button></div>';
h+='<div class="btnrow"><button class="save" onclick="saveCard(\''+id+'\')">💾 Save</button><button class="del" onclick="deleteOne(\''+id+'\')">🗑 Delete</button></div>';
h+='</div>';return h;
}
document.addEventListener("input",function(e){
var t=e.target;if(!t.classList||!t.classList.contains("ci"))return;
var f=t.getAttribute("data-f");if(f!=="price"&&f!=="discount")return;
var el=t.closest(".card");if(!el)return;
var pr=parseFloat(el.querySelector('[data-f="price"]').value)||0;
var d=parseFloat(el.querySelector('[data-f="discount"]').value)||0;
var cu=d>0?Math.round(pr*(1-d/100)):pr;
el.querySelector('[data-f="_cur"]').value=cu;
el.querySelector(".curline").innerHTML=d>0?'<s>৳'+pr+'</s> → <b class="auto">৳'+cu+'</b> <span style="color:#f39c12">(Save ৳'+(pr-cu)+')</span>':'৳'+pr+' <span style="color:#888">(কোনো ডিসকাউন্ট নেই)</span>';
});
function readCard(el){
return {name:el.querySelector('[data-f="name"]').value.trim(),
price:parseFloat(el.querySelector('[data-f="price"]').value)||0,
discount:parseFloat(el.querySelector('[data-f="discount"]').value)||0,
originalPrice:parseFloat(el.querySelector('[data-f="originalPrice"]').value)||0,
stock:parseFloat(el.querySelector('[data-f="stock"]').value)||0,
startDate:el.querySelector('[data-f="startDate"]').value.trim(),
endDate:el.querySelector('[data-f="endDate"]').value.trim()};
}
function writeSplit(orig,path,id,v,img){
var up={};var M=MASTER+"/"+id+"/";
up[M+"title"]=v.name;up[M+"name"]=v.name;up[M+"price"]=v.price;up[M+"discount"]=v.discount;
up[M+"discountPrice"]=v.originalPrice||0;up[M+"stock"]=v.stock;
up[M+"startDate"]=v.startDate;up[M+"endDate"]=v.endDate;
up[M+"status"]="active";up[M+"category"]=CAT||"Uncategorized";up[M+"categoryId"]=CAT;
up[M+"updatedAt"]=firebase.database.ServerValue.TIMESTAMP;
if(img===undefined||img===""){img=gv(orig,"image")||"";}
if(img!==""){up[M+"image"]=img;up[M+"img"]=img;up[M+"images"]={main:img};}
up[path+"/"+id+"/startDate"]=v.startDate;up[path+"/"+id+"/endDate"]=v.endDate;
up[path+"/"+id+"/discountPercent"]=v.discount;up[path+"/"+id+"/id"]=id;
up[path+"/"+id+"/addedAt"]=(orig&&orig.addedAt)||Date.now();
return up;
}
window.uploadImg=async function(id){
var inp=document.getElementById("img_"+id);if(!inp||!inp.files||!inp.files[0])return alert("ছবি সিলেক্ট করুন");
st("Cloudinary আপলোড হচ্ছে...","#f39c12");
try{
if(!window.MJHCloud)throw new Error("Cloudinary লাইব্রেরি লোড হয়নি");
var r=await window.MJHCloud.upload(inp.files[0]);var url=r.url;
var up={};var M=MASTER+"/"+id+"/";
up[M+"image"]=url;up[M+"img"]=url;up[M+"images"]={main:url};
var el=document.querySelector('.card[data-id="'+id+'"]');var path=el.getAttribute("data-path")||cp();
up[path+"/"+id+"/image"]=url;
await db.ref().update(up);
st("✅ ছবি Cloudinary-তে আপলোড + Firebase master + map","#2ecc71");loadList();
}catch(e){alert("❌ "+e.message);}
};
window.saveCard=async function(id){
var el=document.querySelector('.card[data-id="'+id+'"]');if(!el)return;
var path=el.getAttribute("data-path")||cp();
var v=readCard(el);var orig=P[id]||{};
try{
var up=writeSplit(orig,path,id,v);
await db.ref().update(up);
st("✅ Firebase-এ সেভ: মাস্টার + ক্যাটাগরি ম্যাপ","#2ecc71");
var mm2=await mergeMaster(id,orig._map||{})||{};mm2._path=path;P[id]=mm2;
if(v.name!==gv(orig,"name"))await syncByName(v.name,id,path);
render();
}catch(e){alert("❌ "+e.message);}
};
window.saveSelected=async function(){
var els=checkedEls();if(!els.length)return alert("কিছুই সিলেক্ট করা হয়নি");
var up={};var changed=[];
els.forEach(function(cb){
var id=cb.value;var el=cb.closest(".card");if(!el)return;
var path=el.getAttribute("data-path")||cp();
var v=readCard(el);var orig=P[id]||{};
Object.assign(up,writeSplit(orig,path,id,v));
if(v.name!==gv(orig,"name"))changed.push({id:id,name:v.name,path:path});
});
try{
await db.ref().update(up);
for(var i=0;i<changed.length;i++)await syncByName(changed[i].name,changed[i].id,changed[i].path);
st("✅ সিলেক্টেড সব সেভ (মাস্টার + ম্যাপ)","#2ecc71");loadList();
}catch(e){alert("❌ "+e.message);}
};
window.applyDisc=async function(){
var els=checkedEls();if(!els.length)return alert("কিছুই সিলেক্ট করা হয়নি");
var v=parseFloat(document.getElementById("bpct").value);if(isNaN(v))return alert("% দিন");
var up={};els.forEach(function(cb){var el=cb.closest(".card");var path=el.getAttribute("data-path")||cp();
up[MASTER+"/"+cb.value+"/discount"]=v;up[path+"/"+cb.value+"/discountPercent"]=v;});
try{await db.ref().update(up);st("✅ ডিসকাউন্ট বসেছে","#2ecc71");loadList();}catch(e){alert("❌ "+e.message);}
};
window.applyDates=async function(){
var els=checkedEls();if(!els.length)return alert("কিছুই সিলেক্ট করা হয়নি");
var s=document.getElementById("bstart").value.trim(),e2=document.getElementById("bend").value.trim();
var up={};els.forEach(function(cb){var el=cb.closest(".card");var path=el.getAttribute("data-path")||cp();
if(s){up[MASTER+"/"+cb.value+"/startDate"]=s;up[path+"/"+cb.value+"/startDate"]=s;}
if(e2){up[MASTER+"/"+cb.value+"/endDate"]=e2;up[path+"/"+cb.value+"/endDate"]=e2;}});
try{await db.ref().update(up);st("✅ তারিখ বসেছে","#2ecc71");loadList();}catch(e){alert("❌ "+e.message);}
};
window.hideSelected=async function(){
var els=checkedEls();if(!els.length)return alert("কিছুই সিলেক্ট করা হয়নি");
var up={};els.forEach(function(cb){var p=P[cb.value]||{};
up[MASTER+"/"+cb.value+"/status"]=(p.status==="active")?"inactive":"active";});
try{await db.ref().update(up);st("✅ হাইড টগল (status active/inactive)","#2ecc71");loadList();}catch(e){alert("❌ "+e.message);}
};
window.deleteSelected=async function(){
var els=checkedEls();if(!els.length)return alert("কিছুই সিলেক্ট করা হয়নি");
if(!confirm(els.length+" টি পণ্য মাস্টার + সব ক্যাটাগরি + Cloudinary থেকে ডিলিট হবে?"))return;
var ids=[];els.forEach(function(cb){ids.push(cb.value);});
await purge(ids);
};
window.deleteOne=async function(id){
if(!confirm("মাস্টার + সব ক্যাটাগরি + Cloudinary থেকে ডিলিট হবে?"))return;
await purge([id]);
};
async function purge(ids){
try{
var up={};
ids.forEach(function(id){var p=P[id]||{};up[(p._path||cp())+"/"+id]=null;up[MASTER+"/"+id]=null;});
for(var i=0;i<SECTIONS.length;i++){
var s=await db.ref(SECTIONS[i].prods).once("value");var all=s.val()||{};
Object.keys(all).forEach(function(catId){var items=all[catId]||{};ids.forEach(function(id){if(items[id])up[SECTIONS[i].prods+"/"+catId+"/"+id]=null;});});
}
var cs=await restShallow("settings/customSectionProducts");
if(cs){for(var sec in cs){var s2=await db.ref("settings/customSectionProducts/"+sec).once("value");var all2=s2.val()||{};
Object.keys(all2).forEach(function(catId){var items=all2[catId]||{};ids.forEach(function(id){if(items[id])up["settings/customSectionProducts/"+sec+"/"+catId+"/"+id]=null;});});}}
await db.ref().update(up);
for(var j=0;j<ids.length;j++){
var p=P[ids[j]]||{};var img=gv(p,"image");
if(img&&window.MJHCloud&&window.MJHCloud.remove){try{await window.MJHCloud.remove(img);}catch(e){}}
}
st("✅ মাস্টার + সব ক্যাটাগরি + Cloudinary থেকে ডিলিট হয়েছে","#2ecc71");loadList();
}catch(e){alert("❌ "+e.message);}
}
window.priceList=async function(){
var lines=document.getElementById("bulktext").value.split(/\n+/);
var items=[];
lines.forEach(function(ln){
ln=ln.trim();if(!ln)return;
if(ln.charAt(ln.length-1)===",")ln=ln.slice(0,-1);
var i=ln.lastIndexOf("-");if(i<0)i=ln.lastIndexOf(":");
if(i<0)return;
var name=ln.slice(0,i).trim();var pp=ln.slice(i+1).trim();
if(!name||!/[0-9]/.test(pp))return;
var mm=pp.match(/[৳$€₹£¥₩₽₺]/);var curSym=mm?mm[0]:"৳";
var num=parseFloat(pp.replace(/[^0-9.]/g,""));if(isNaN(num))return;
items.push({n:nkey(name).replace(/,/g,""),t:toks(name),price:num,cur:curSym});
});
if(!items.length)return alert("পার্স হয়নি। ফরম্যাট: নাম - দাম");
var up={};var cnt=0;
Object.keys(P).forEach(function(id){
var pn=toks(gv(P[id],"name"));
items.forEach(function(it){
if(pn&&it.t&&(pn===it.t||pn.indexOf(it.n)>=0||it.n.indexOf(pn)>=0)){
up[MASTER+"/"+id+"/price"]=it.price;up[MASTER+"/"+id+"/cur"]=it.cur;cnt++;
}
});
});
if(!cnt)return alert("কোনো নাম মেলেনি");
try{
await db.ref().update(up);
document.getElementById("pricemsg").textContent="✅ "+cnt+" টি প্রোডাক্টে দাম বসেছে (লাইন: "+items.length+")";
st("✅ মাস্টারে দাম বসেছে: "+cnt,"#2ecc71");loadList();
}catch(e){alert("❌ "+e.message);}
};
window.markAll=function(cb){document.querySelectorAll(".sel").forEach(function(x){x.checked=cb.checked;});};
async function syncByName(name,id,path){
try{
var me=await db.ref(MASTER+"/"+id).once("value");var pd=me.val()||{};
if(!pd||!pd.name){
var cur=await db.ref((path||cp())+"/"+id).once("value");var cv=cur.val()||{};
if(cv&&cv.name){
var master={id:id,title:cv.name,name:cv.name,price:cv.price||0,discount:cv.discount||0,discountPrice:cv.originalPrice||0,stock:cv.stock||0,image:cv.image||"",img:cv.image||"",images:{main:cv.image||""},startDate:cv.startDate||"",endDate:cv.endDate||"",status:"active",category:CAT||"Uncategorized",categoryId:CAT,createdAt:Date.now()};
await db.ref(MASTER+"/"+id).set(master);pd=master;
}}
var up={};var n=0;
for(var i=0;i<SECTIONS.length;i++){
var cs=await db.ref(SECTIONS[i].cats).once("value");var cats=cs.val()||{};
Object.keys(cats).forEach(function(catId){
var cn=cats[catId]&&(cats[catId].name||cats[catId].title||cats[catId].label||"");
if(matches(name,cn)){
up[SECTIONS[i].prods+"/"+catId+"/"+id]={id:id,addedAt:Date.now(),startDate:pd.startDate||"",endDate:pd.endDate||"",discountPercent:pd.discount||0};n++;}
});}
if(n)await db.ref().update(up);
st("✅ সিঙ্ক: "+n+" ক্যাটাগরি (master সহ)","#9b59b6");
}catch(e){console.warn(e);}
}
window.doSearch=async function(){
var q=norm(document.getElementById("q").value.trim());
var box=document.getElementById("searchres");
if(q.length<2){box.style.display="none";return;}
box.innerHTML='<p style="padding:8px;color:#888">খোঁজা হচ্ছে...</p>';box.style.display="block";
var found={};
for(var i=0;i<SECTIONS.length;i++){
var s=await db.ref(SECTIONS[i].prods).once("value");var all=s.val()||{};
for(var catId in all){var items=all[catId]||{};
for(var id in items){
if(found[id])continue;
var p=items[id]||{};var nm=gv(p,"name");
if(!nm){var m=await db.ref(MASTER+"/"+id).once("value");var mv=m.val()||{};nm=gv(mv,"name");p=Object.assign({},p,mv);}
if(nm&&norm(nm).indexOf(q)>=0)found[id]=p;
}}}
var ks=Object.keys(found).slice(0,15);
if(!ks.length){box.innerHTML='<p style="padding:8px;color:#888">কিছু পাওয়া যায়নি</p>';return;}
var h="";ks.forEach(function(id){h+='<div class="sr"><span>'+gv(found[id],"name")+' <small style="color:#888">('+id+')</small></span><button class="blue" onclick="addFound(\''+id+'\')">➕ যোগ করুন</button></div>';});
box.innerHTML=h;box._found=found;
};
window.addFound=async function(id){
var p=document.getElementById("searchres")._found[id];if(!p)return;
var entry={id:id,addedAt:Date.now(),startDate:p.startDate||"",endDate:p.endDate||"",discountPercent:p.discount||0};
await db.ref(cp()+"/"+id).set(entry);
await db.ref(MASTER+"/"+id+"/status").set("active");
st("✅ যোগ হয়েছে","#2ecc71");document.getElementById("searchres").style.display="none";loadList();
};
document.getElementById("bulkimg").addEventListener("change",async function(){
var fs=this.files;if(!fs||!fs.length)return;
st("Cloudinary আপলোড হচ্ছে...","#f39c12");
try{
if(!BASEPATH)await detectBase();
var ts=Date.now();
for(var i=0;i<fs.length;i++){
var f=fs[i];var url="";
if(window.MJHCloud){var r=await window.MJHCloud.upload(f);url=r.url;}
var base=f.name.replace(/\.[^.]+$/,"");
var id="p_"+ts+"_"+i;
var master={id:id,title:base,name:base,price:0,discount:0,discountPrice:0,stock:0,image:url,img:url,images:{main:url},startDate:"",endDate:"",status:"active",category:CAT||"Uncategorized",categoryId:CAT,createdAt:ts+i};
var entry={id:id,addedAt:ts+i,startDate:"",endDate:"",discountPercent:0};
var up={};up[MASTER+"/"+id]=master;up[cp()+"/"+id]=entry;
await db.ref().update(up);
await syncByName(base,id,cp());
}
st("✅ "+fs.length+" টি সেভ: মাস্টার + ম্যাপ + Cloudinary","#2ecc71");loadList();
}catch(e){alert("❌ "+e.message);}
this.value="";
});
loadList();
</script>
