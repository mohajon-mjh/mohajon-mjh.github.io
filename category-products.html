<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>প্রোডাক্ট ম্যানেজার v4</title>
<style>
body{background:#111;color:#eee;font-family:sans-serif;margin:0;padding:12px}
.bar{background:#1d2733;border-radius:10px;padding:10px;margin:10px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:none;border-radius:8px;padding:9px 12px;font-weight:700;cursor:pointer;color:#fff}
input,textarea{background:#0b0f14;color:#eee;border:1px solid #333;border-radius:6px;padding:8px}
.card{background:#16202b;border-radius:12px;padding:10px;margin:10px 0}
#badge{position:fixed;top:8px;right:8px;background:#f39c12;color:#111;font-weight:700;padding:8px 12px;border-radius:10px;z-index:99}
img.th{width:70px;height:70px;object-fit:cover;border-radius:8px}
.cur{color:#2ecc71;font-weight:700}
h3{color:#f39c12}
</style>
</head>
<body>
<div id="badge">☑️ 0/0</div>
<h2 id="head">লোড হচ্ছে...</h2>
<div id="loginBox" class="bar" style="display:none">
<input id="em" placeholder="Email" style="flex:1"><input id="pw" type="password" placeholder="Password" style="flex:1">
<button class="btn" style="background:#2980b9" id="loginBtn">লগইন</button>
</div>
<div class="bar">
<input type="file" id="files" accept="image/*" multiple>
<button class="btn" style="background:#27ae60" id="markAll">✅ সব সিলেক্ট</button>
<button class="btn" style="background:#2980b9" id="saveSel">💾 সিলেক্টেড Save</button>
<button class="btn" style="background:#c0392b" id="delSel">🗑️ সিলেক্টেড Delete</button>
</div>
<div class="bar">
<textarea id="paste" rows="3" placeholder="প্রাইস লিস্ট (নাম — ৳দাম)" style="flex:1"></textarea>
<button class="btn" style="background:#2980b9" id="applyPaste">✅ প্রাইস বসান</button>
</div>
<div class="bar">
<input id="pct" type="number" placeholder="%" style="width:70px">
<button class="btn" style="background:#27ae60" id="applyPct">সিলেক্টেড % বসান</button>
<input id="d1" type="date"><input id="d2" type="date">
<button class="btn" style="background:#2980b9" id="applyDates">📆 তারিখ বসান</button>
</div>
<div id="list"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
var CFG = {apiKey: "AIzaSyDj_LLHWBgcKfQClnaOUqEtULHhP1vSVxw",
  authDomain: "mohajon-mjh.firebaseapp.com",
  databaseURL: "https://mohajon-mjh-default-rtdb.firebaseio.com",
  projectId: "mohajon-mjh",
  storageBucket: "mohajon-mjh.firebasestorage.app",
  messagingSenderId: "526105903976",
  appId: "1:526105903976:web:f9321c6d68ecbd19d58cdd"};
firebase.initializeApp(CFG);
var db = firebase.database();
var auth = firebase.auth();
var params = new URLSearchParams(location.search);
var SEC = params.get("sec") || "settings/globalCategoryProducts";
var CAT = params.get("cat") || "";
var FLAG = params.get("flag") || "";
var HAS_CATS = params.get("hasCats") !== "0";
var CS = params.get("cs") === "1";
document.getElementById("head").textContent = "📦 " + CAT + " — প্রোডাক্ট ম্যানেজার";
function log(m){var d=document.getElementById("dbg");if(d){d.textContent+=m+"\n";d.scrollTop=d.scrollHeight;}}
window.onerror=function(msg){log("JS ERROR: "+msg);};
var pending = [];
var existing = [];
function toast(msg, color) {
  var d = document.createElement("div");
  d.textContent = msg;
  d.style.cssText = "position:fixed;top:50px;right:8px;z-index:999;background:" + (color || "#2ecc71") + ";color:#111;font-weight:700;padding:10px 14px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.5)";
  document.body.appendChild(d);
  setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); }, 3000);
}
function badge() {
  var all = document.querySelectorAll(".chk");
  var ch = document.querySelectorAll(".chk:checked");
  document.getElementById("badge").textContent = "☑️ " + ch.length + "/" + all.length;
}
function cur(p) { var d = p.disc || 0; return d > 0 ? (p.price * (100 - d) / 100) : (p.price || 0); }
function cleanName(n) { return n.replace(/\.[a-z0-9]+$/i, "").replace(/[_\-\.]+/g, " ").replace(/\s+/g, " ").trim(); }
function genId() { return "p_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
auth.onAuthStateChanged(function(u) {
  if (u) {
    document.getElementById("loginBox").style.display = "none";
    loadExisting();
  } else {
    document.getElementById("loginBox").style.display = "flex";
  }
});
document.getElementById("loginBtn").onclick = function() {
  auth.signInWithEmailAndPassword(document.getElementById("em").value.trim(), document.getElementById("pw").value).catch(function(e){ log("login err: " + (e.message || e)); toast("❌ লগইন ব্যর্থ: " + e.message, "#c0392b"); });
};
function loadExisting() {
  console.log("/*catDebug*/ SEC=" + SEC + ", CAT=" + CAT + ", FLAG=" + FLAG);
  db.ref(SEC + "/" + CAT).once("value").then(function(snap) {
    var map = snap.val() || {};
    var ids = Object.keys(map);
    log("existing: " + ids.length);
    var proms = ids.map(function(id) {
      return db.ref("products/" + id).once("value").then(function(ps) {
        var p = ps.val();
        if (!p) return null;
        return { id: id, title: p.title || id, img: (p.images && p.images.main) || "", price: p.price || 0, disc: p.discountPercent || 0, start: p.startDate || "", end: p.endDate || "", stock: p.stock || 0, checked: false, kind: "old" };
      });
    });
    Promise.all(proms).then(function(arr) { existing = arr.filter(function(x){ return x; }); render(); });
  }).catch(function(e){ log("load err: " + (e.message || e)); toast("❌ লোড ব্যর্থ: " + e.message, "#c0392b"); });
}
function cardHTML(it, kind, i) {
  var h = '<div class="card" data-id="' + it.id + '">';
  h += '<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" class="chk" data-kind="' + kind + '" data-idx="' + i + '" ' + (it.checked ? "checked" : "") + '> <img class="th" src="' + (it.img || "") + '"><b>' + (it.title || "") + '</b></label>';
  h += '<div class="bar" style="margin:6px 0">নাম:<input class="fTitle" value="' + String(it.title || "").replace(/"/g, "&quot;") + '" style="flex:1">দাম:<input type="number" class="fPrice" value="' + (it.price || 0) + '" style="width:90px">%:<input type="number" class="fDisc" value="' + (it.disc || 0) + '" style="width:60px"></div>';
  h += '<div class="bar" style="margin:6px 0">বর্তমান: <span class="cur">৳' + cur(it).toFixed(2) + '</span> <span style="color:#888;text-decoration:line-through">' + (it.disc > 0 ? "৳" + it.price : "") + '</span> | Save: <span class="cur">৳' + (it.disc > 0 ? (it.price - cur(it)).toFixed(0) : "0") + '</span></div>';
  h += '<div class="bar" style="margin:6px 0">শুরু:<input type="date" class="fStart" value="' + (it.start || "") + '">শেষ:<input type="date" class="fEnd" value="' + (it.end || "") + '">স্টক:<input type="number" class="fStock" value="' + (it.stock || 0) + '" style="width:60px">';
  h += '<button class="btn" style="background:#2980b9" data-save="' + kind + ':' + i + '">💾 Save</button>';
  h += '<button class="btn" style="background:#c0392b" data-del="' + kind + ':' + i + '">🗑️ Remove</button></div></div>';
  return h;
}
function render() {
  var html = "<h3>নতুন পণ্য (" + pending.length + ")</h3>";
  pending.forEach(function(it, i){ html += cardHTML(it, "new", i); });
  html += "<h3>আগের পণ্য (" + existing.length + ")</h3>";
  existing.forEach(function(it, i){ html += cardHTML(it, "old", i); });
  document.getElementById("list").innerHTML = html;
  badge();
}
function readCard(card, it) {
  it.title = card.querySelector(".fTitle").value;
  it.price = +card.querySelector(".fPrice").value || 0;
  it.disc = +card.querySelector(".fDisc").value || 0;
  it.start = card.querySelector(".fStart").value;
  it.end = card.querySelector(".fEnd").value;
  it.stock = +card.querySelector(".fStock").value || 0;
}
function shrink(url){return new Promise(function(res){var fin=false;var to=setTimeout(function(){if(!fin){fin=true;res("");}},6000);var img=new Image();img.onload=function(){if(fin)return;try{var c=document.createElement("canvas");var w=400,h2=Math.round(400*img.height/img.width)||400;c.width=w;c.height=h2;var cx=c.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,w,h2);cx.drawImage(img,0,0,w,h2);fin=true;clearTimeout(to);res(c.toDataURL("image/jpeg",0.72));}catch(e){fin=true;clearTimeout(to);res("");}};img.onerror=function(){if(!fin){fin=true;clearTimeout(to);res("");}};img.src=url;});}
function saveItem(it, done) {
  var s = { hasCats: HAS_CATS, prodPath: SEC, flag: FLAG, cs: CS };
  var p = { title: it.title, price: +it.price || 0, stock: +it.stock || 0, start: it.start || "", end: it.end || "", file: it.file || null };
  var id = it.id;
  
  // পুরনো অ্যাডমিনের হুবহু কোড
  var url = "";
  if (p.file) {
    try {
      var rd = new FileReader();
      rd.onload = function() {
        var img = new Image();
        img.onload = function() {
          var c = document.createElement("canvas");
          var w = 400, h2 = Math.round(400 * img.height / img.width) || 400;
          c.width = w; c.height = h2;
          var cx = c.getContext("2d");
          cx.fillStyle = "#fff";
          cx.fillRect(0, 0, w, h2);
          cx.drawImage(img, 0, 0, w, h2);
          url = c.toDataURL("image/jpeg", 0.72);
          finish();
        };
        img.onerror = function() { finish(); };
        img.src = rd.result;
      };
      rd.onerror = function() { finish(); };
      rd.readAsDataURL(p.file);
    } catch (e) { finish(); }
  } else {
    url = it.img || "";
    finish();
  }
  
  function finish() {
    var obj = {
      title: p.title,
      price: +p.price || 0,
      stock: +p.stock || 0,
      status: "active",
      sellerId: (window.__mjhUid || "mjh-admin"),
      categoryId: (CAT || "general"),
      createdAt: Date.now(),
      startDate: p.start || "",
      endDate: p.end || "",
      images: { main: url || "" }
    };
    
    var writeP;
    if (it.kind === "old") {
      var up2 = {}; var base = "products/" + id + "/";
      up2[base+"title"]=obj.title; up2[base+"price"]=obj.price; up2[base+"stock"]=obj.stock; up2[base+"status"]=obj.status; up2[base+"startDate"]=obj.startDate; up2[base+"endDate"]=obj.endDate; up2[base+"categoryId"]=obj.categoryId; up2[base+"images/main"]=obj.images.main; if (it.disc>0) up2[base+"discountPercent"]=it.disc;
      writeP = db.ref().update(up2);
    } else {
      writeP = db.ref("products/" + id).set(obj);
    }
    console.log("/*saveDebug*/ saving to:", SEC + "/" + CAT + "/" + id);
    writeP.then(function() {
      var promises = [];
      if (s.hasCats && CAT) {
        promises.push(db.ref(s.prodPath + "/" + CAT + "/" + id).set({ id: id, addedAt: Date.now() }));
        if (s.prodPath.indexOf("catProducts") > -1) {
          var alt = s.prodPath.replace("customSections/", "customSectionProducts/").replace("/catProducts", "");
          promises.push(db.ref(alt + "/" + CAT + "/" + id).set({ id: id, addedAt: Date.now() }).catch(function(){}));
        }
      }
      if (s.flag) {
        promises.push(db.ref("products/" + id + "/" + s.flag).set(true));
      }
      if (s.cs) {
        promises.push(db.ref("futureProducts/" + id).set({
          title: p.title,
          expectedPrice: p.price,
          discountPercent: 0,
          categoryId: "coming_soon",
          createdAt: Date.now(),
          released: false,
          images: { main: url || "" }
        }));
      }
      if (it.disc > 0) { promises.push(db.ref("products/" + id + "/discountPercent").set(it.disc).catch(function(){})); }
      return Promise.all(promises);
    }).then(function() {
      done(null);
    }).catch(function(e) {
      done(e);
    });
  }
}
function delItem(it, done) {
  var up = {};
  if (HAS_CATS) {
    up[SEC + "/" + CAT + "/" + it.id] = null;
  } else if (CS) {
    up["futureProducts/" + it.id] = null;
  }
  up["products/" + it.id] = null;
  db.ref().update(up).then(function(){ done(null); }).catch(function(e){ done(e); });
}
document.getElementById("list").addEventListener("change", function(e) {
  var t = e.target;
  if (t.classList.contains("chk")) {
    var arr = t.dataset.kind === "new" ? pending : existing;
    arr[+t.dataset.idx].checked = t.checked;
    badge();
  }
  var card = t.closest ? t.closest(".card") : null;
  if (card && (t.classList.contains("fPrice") || t.classList.contains("fDisc"))) {
    var ck = card.querySelector(".chk");
    var a2 = ck.dataset.kind === "new" ? pending : existing;
    var it2 = a2[+ck.dataset.idx];
    readCard(card, it2);
    card.querySelector(".cur").textContent = "৳" + cur(it2).toFixed(2);
  }
  if (t.classList.contains("fImg")) {
    var f = t.files[0]; if (!f) return;
    var c2 = t.closest(".card");
    var ck2 = c2.querySelector(".chk");
    var a3 = ck2.dataset.kind === "new" ? pending : existing;
    var it3 = a3[+ck2.dataset.idx];
    var rd = new FileReader();
    rd.onload = function(){ it3.img = rd.result; c2.querySelector(".th").src = rd.result; toast("✅ ছবি যুক্ত হয়েছে"); };
    rd.readAsDataURL(f);
  }
});
document.getElementById("list").addEventListener("click", function(e) {
  var sv = e.target.closest("[data-save]");
  var dl = e.target.closest("[data-del]");
  if (sv) {
    var parts = sv.dataset.save.split(":");
    var arr = parts[0] === "new" ? pending : existing;
    var it = arr[+parts[1]];
    readCard(sv.closest(".card"), it);
    saveItem(it, function(err){
      toast(err ? "❌ ব্যর্থ: " + (err.message || err) : "✅ সেভ হয়েছে: " + it.title, err ? "#c0392b" : "#2ecc71");
      if (!err) { if (parts[0] === "new") pending = pending.filter(function(x){ return x.id !== it.id; }); loadExisting(); }
    });
  }
  if (dl) {
    var p2 = dl.dataset.del.split(":");
    var a4 = p2[0] === "new" ? pending : existing;
    var it4 = a4[+p2[1]];
    if (p2[0] === "new") { pending = pending.filter(function(x){ return x.id !== it4.id; }); render(); }
    else delItem(it4, function(err){ toast(err ? "❌ ব্যর্থ" : "🗑️ ডিলিট হয়েছে", err ? "#c0392b" : "#e67e22"); if(!err) loadExisting(); });
  }
});
function onFiles(e) {
  log("file event: " + (e.target.files ? e.target.files.length : 0));
  [].slice.call(e.target.files || []).forEach(function(f) {
    var it = { id: genId(), title: cleanName(f.name), img: "", price: 0, disc: 0, start: "", end: "", stock: 10, checked: true };
    pending.push(it);
    log("added: " + it.title);
    render();
    var rd = new FileReader();
    rd.onload = function(){ it.img = rd.result; var el = document.querySelector('[data-id="' + it.id + '"] .th'); if (el) el.src = rd.result; log("img ok: " + it.title); };
    rd.onerror = function(){ log("FileReader ERROR: " + it.title); };
    rd.readAsDataURL(f);
  });
}
document.getElementById("files").addEventListener("change", onFiles);
function checkedItems() {
  var out = [];
  pending.forEach(function(p){ if(p.checked) out.push(p); });
  existing.forEach(function(p){ if(p.checked) out.push(p); });
  return out;
}
document.getElementById("markAll").onclick = function() {
  pending.forEach(function(p){ p.checked = true; });
  existing.forEach(function(p){ p.checked = true; });
  render();
};
document.getElementById("applyPaste").onclick = function() {
  var lines = document.getElementById("paste").value.split(/\r?\n/);
  var n = 0;
  lines.forEach(function(ln) {
    var mm = ln.match(/^(.+?)\s*[—–-]+\s*৳?\s*([\d,.]+)/);
    if (!mm) return;
    var name = mm[1].trim().toLowerCase();
    var price = parseFloat(mm[2].replace(/,/g, ""));
    pending.concat(existing).forEach(function(it) {
      if (name && it.title && (it.title.toLowerCase().indexOf(name) > -1 || name.indexOf(it.title.toLowerCase()) > -1)) { it.price = price; n++; }
    });
  });
  render();
  toast("✅ " + n + "টি পণ্যে দাম বসেছে");
};
document.getElementById("applyPct").onclick = function() {
  var v = +document.getElementById("pct").value || 0;
  var items = checkedItems();
  items.forEach(function(it){ it.disc = v; });
  render();
  toast("✅ " + items.length + "টি পণ্যে " + v + "% বসেছে");
};
document.getElementById("applyDates").onclick = function() {
  var sV = document.getElementById("d1").value;
  var eV = document.getElementById("d2").value;
  var items = checkedItems();
  items.forEach(function(it){ it.start = sV; it.end = eV; });
  render();
  toast("✅ " + items.length + "টি পণ্যে তারিখ বসেছে");
};
document.getElementById("saveSel").onclick = function() {
  var items = checkedItems();
  if (!items.length) { toast("❌ কোনো সিলেক্ট নেই", "#c0392b"); return; }
  var done = 0, i = 0, lastErr = "";
  var pr = document.getElementById("prog");
  if (!pr) { pr = document.createElement("div"); pr.id = "prog"; pr.style.cssText = "position:fixed;top:8px;left:8px;background:#f39c12;color:#111;font-weight:700;padding:8px 12px;border-radius:10px;z-index:99"; document.body.appendChild(pr); }
  pr.style.display = "block";
  pr.textContent = "⏳ সেভ: 0/" + items.length;
  (function next() {
    if (i >= items.length) {
      pr.style.display = "none";
      toast("✅ সফল: " + done + "/" + items.length + (done < items.length ? " | ❌ " + lastErr : ""));
      pending = pending.filter(function(p){ return !p.__ok; });
      loadExisting();
      return;
    }
    var it = items[i]; i++;
    pr.textContent = "⏳ সেভ: " + i + "/" + items.length;
    var called = false;
    var wd = setTimeout(function(){ if(!called){ called = true; lastErr = "timeout"; next(); } }, 25000);
    saveItem(it, function(err){ if(called) return; called = true; clearTimeout(wd); if(!err){ done++; it.__ok = true; } else { lastErr = (err && err.message) ? err.message : String(err); } next(); });
  })();
};
document.getElementById("delSel").onclick = function() {
  var items = checkedItems();
  if (!items.length) { toast("❌ কোনো সিলেক্ট নেই", "#c0392b"); return; }
  if (!confirm(items.length + "টি পণ্য ডিলিট করবেন?")) return;
  var done = 0;
  (function next() {
    if (!items.length) { toast("🗑️ ডিলিট: " + done); loadExisting(); return; }
    var it = items.shift();
    if (pending.indexOf(it) > -1) { pending = pending.filter(function(x){ return x.id !== it.id; }); done++; next(); }
    else delItem(it, function(err){ if(!err) done++; next(); });
  })();
};
</script>

<div id="veBox" style="background:#16202c;border:1px solid #2b3a4a;border-radius:12px;padding:12px;margin:12px">
<h3 style="margin:0 0 10px;color:#f39c12">🧬 Size / Color / Description / Image Editor</h3>
<div id="veStatus" style="color:#f39c12;font-size:13px;margin-bottom:8px">🔎 পণ্য লোড হচ্ছে...</div>
<select id="veProd" style="width:100%;padding:10px;margin-bottom:8px;background:#0f1720;color:#fff;border:1px solid #2b3a4a;border-radius:6px"></select>
<input id="veSizes" placeholder="Sizes: S,M,L,XL,XXL" style="width:100%;padding:9px;margin-bottom:6px;background:#0f1720;color:#fff;border:1px solid #2b3a4a;border-radius:6px;box-sizing:border-box">
<input id="veColors" placeholder="Colors: White,Red,Blue,Black" style="width:100%;padding:9px;margin-bottom:6px;background:#0f1720;color:#fff;border:1px solid #2b3a4a;border-radius:6px;box-sizing:border-box">
<input id="veVars" placeholder="Version: 4GB/64GB,6GB/128GB,8GB/256GB" style="width:100%;padding:9px;margin-bottom:6px;background:#0f1720;color:#fff;border:1px solid #2b3a4a;border-radius:6px;box-sizing:border-box">
<textarea id="veDesc" rows="4" placeholder="Description — প্রতি লাইনে একটা পয়েন্ট" style="width:100%;padding:9px;margin-bottom:6px;background:#0f1720;color:#fff;border:1px solid #2b3a4a;border-radius:6px;box-sizing:border-box"></textarea>
<input id="veNoStock" placeholder="No stock: Size:XL,Color:Black" style="width:100%;padding:9px;margin-bottom:6px;background:#0f1720;color:#fff;border:1px solid #2b3a4a;border-radius:6px;box-sizing:border-box">
<input type="file" id="veImg" accept="image/*" style="width:100%;margin-bottom:6px;color:#fff">
<label style="color:#fff;font-size:13px"><input type="checkbox" id="veHide"> পণ্য Hide করুন (কাস্টমার দেখবে না)</label><br>
<button id="veSave" style="background:#27ae60;color:#fff;border:none;padding:10px 18px;border-radius:8px;font-weight:700;margin-top:8px">💾 Save Variants</button>
</div>
<script>
/* mjhVariantEditor v1 */
(function(){
var DB="https://mohajon-mjh-default-rtdb.firebaseio.com";
function j(p){return fetch(DB+"/"+p+".json").then(function(r){return r.json();});}
function st(t){var el=document.getElementById("veStatus");if(el)el.textContent=t;console.log("[ve]",t);}
var SEC=window.SEC||"settings/globalCategoryProducts",CAT=window.CAT||"";
function moveTop(){var box=document.getElementById("veBox");if(!box)return;var all=[].slice.call(document.querySelectorAll("body *"));for(var i=0;i<all.length;i++){var t=(all[i].textContent||"").trim();if(t.indexOf("নতুন পণ্য")===0&&t.length<20){all[i].parentNode.insertBefore(box,all[i]);return;}}}
function build(ids){
  var selEl=document.getElementById("veProd");if(!selEl)return;
  if(!ids.length){st("❌ কোনো পণ্য পাওয়া যায়নি");return;}
  var ps=[];var done=0;
  ids.forEach(function(pid){j("products/"+pid).then(function(p){done++;if(p)ps.push({id:pid,t:p.title||pid});if(done===ids.length){ps.sort(function(a,b){return a.t.localeCompare(b.t);});selEl.innerHTML='<option value="">-- পণ্য বাছাই করুন --</option>'+ps.map(function(x){return '<option value="'+x.id+'">'+x.t+'</option>';}).join("");st("✅ "+ps.length+"টি পণ্য লোড হয়েছে — dropdown থেকে বাছুন");}}).catch(function(){done++;});});
}
function fillList(){
  st("🔎 পণ্য খোঁজা হচ্ছে...");
  var paths=[SEC+"/"+(CAT||""),"settings/flashSaleCategoryProducts/"+CAT,"settings/dealsOfDayCategoryProducts/"+CAT,"settings/specialCategoryProducts/"+CAT,"settings/globalCategoryProducts/"+CAT];
  function tryPath(i){
    if(i>=paths.length){st("🔎 সব পণ্য লোড হচ্ছে...");j("products").then(function(all){build(Object.keys(all||{}));}).catch(function(err){st("❌ "+err.message);});return;}
    j(paths[i]).then(function(map){var ids=Object.keys(map||{});if(ids.length){build(ids);}else tryPath(i+1);}).catch(function(){tryPath(i+1);});
  }
  tryPath(0);
}
function load(){
  var id=document.getElementById("veProd").value;if(!id)return;
  st("📥 পণ্যের তথ্য লোড হচ্ছে...");
  j("products/"+id).then(function(p){
    if(!p)return;
    document.getElementById("veSizes").value=p.sizes||"";
    document.getElementById("veColors").value=p.colors||"";
    document.getElementById("veVars").value=p.variants||"";
    document.getElementById("veDesc").value=p.description||"";
    document.getElementById("veNoStock").value=p.noStock||"";
    document.getElementById("veHide").checked=(p.status==="hidden");
    st("✅ লোড হয়েছে — এডিট করে Save চাপুন");
  });
}
function save(){
  var id=document.getElementById("veProd").value;
  if(!id){st("❌ আগে পণ্য সিলেক্ট করুন");alert("❌ আগে dropdown থেকে পণ্য সিলেক্ট করুন");return;}
  var up={};
  var base="products/"+id+"/";
  up[base+"sizes"]=document.getElementById("veSizes").value.trim();
  up[base+"colors"]=document.getElementById("veColors").value.trim();
  up[base+"variants"]=document.getElementById("veVars").value.trim();
  up[base+"description"]=document.getElementById("veDesc").value.trim();
  up[base+"noStock"]=document.getElementById("veNoStock").value.trim();
  up[base+"status"]=document.getElementById("veHide").checked?"hidden":"active";
  var f=document.getElementById("veImg").files[0];
  function fin(){st("💾 সেভ হচ্ছে...");db.ref().update(up).then(function(){st("✅ সেভ হয়েছে!");alert("✅ সেভ হয়েছে! Size/Color/Description আপডেট হয়েছে।");}).catch(function(err){st("❌ "+err.message);alert("❌ সেভ ব্যর্থ: "+err.message);});}
  if(f){st("🖼️ ছবি প্রসেস হচ্ছে...");var rd=new FileReader();rd.onload=function(){if(typeof shrink==="function"){shrink(rd.result).then(function(u){if(u)up[base+"images/main"]=u;fin();});}else{up[base+"images/main"]=rd.result;fin();}};rd.readAsDataURL(f);}else fin();
  return;
  st("📥 পুরো পণ্য পড়া হচ্ছে...");
  j("products/"+id).then(function(P){
    if(!P){alert("❌ পণ্য পাওয়া যায়নি");return;}
    P.sizes=document.getElementById("veSizes").value.trim();
    P.colors=document.getElementById("veColors").value.trim();
    P.variants=document.getElementById("veVars").value.trim();
    P.description=document.getElementById("veDesc").value.trim();
    P.noStock=document.getElementById("veNoStock").value.trim();
    P.status=document.getElementById("veHide").checked?"hidden":"active";
    var f=document.getElementById("veImg").files[0];
    function fin(){
      st("💾 সেভ হচ্ছে (পুরো অবজেক্ট)...");
      db.ref("products/"+id).set(P).then(function(){
        st("✅ সেভ হয়েছে!");alert("✅ সেভ হয়েছে! Size/Color/Description আপডেট হয়েছে।");
      }).catch(function(err){
        st("⚠️ set ব্যর্থ, child-update চেষ্টা...");
        var up={};["sizes","colors","variants","description","noStock","status"].forEach(function(k){up["products/"+id+"/"+k]=P[k];});
        db.ref().update(up).then(function(){st("✅ সেভ হয়েছে!");alert("✅ সেভ হয়েছে!");}).catch(function(e2){st("❌ "+e2.message);alert("❌ সেভ ব্যর্থ: "+e2.message);});
      });
    }
    if(f){st("🖼️ ছবি প্রসেস হচ্ছে...");var rd=new FileReader();rd.onload=function(){if(typeof shrink==="function"){shrink(rd.result).then(function(u){if(u){P.images=P.images||{};P.images.main=u;fin();}});}else{P.images=P.images||{};P.images.main=rd.result;fin();}};rd.readAsDataURL(f);}else fin();
  }).catch(function(err){alert("❌ "+err.message);});
}
moveTop();setTimeout(moveTop,800);setTimeout(moveTop,2000);
var n=0;var iv=setInterval(function(){n++;var b=document.getElementById("veSave");if(b||n>20){clearInterval(iv);if(b){b.onclick=save;var selEl=document.getElementById("veProd");if(selEl)selEl.onchange=load;fillList();}}},500);
})();
</script>

<script>
/* mjhJumpBtn v1 */
(function(){
function addBtn(){
if(document.getElementById("veJump"))return;
var b=document.createElement("button");b.id="veJump";b.textContent="🧬 Editor";
b.style.cssText="position:fixed;top:8px;right:8px;z-index:99999;background:#f39c12;color:#111;border:none;border-radius:20px;padding:8px 14px;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.4);cursor:pointer";
b.onclick=function(){var v=document.getElementById("veBox");if(v)v.scrollIntoView({behavior:"smooth"});};
document.body.appendChild(b);
}
if(document.readyState==="complete")addBtn();else window.addEventListener("load",addBtn);
})();
</script>
</body>
</html>
