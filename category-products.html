<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>প্রোডাক্ট ম্যানেজার v4</title>
<style>
body{background:#111;color:#eee;font-family:sans-serif;margin:0;padding:12px}
.bar{background:#1d2733;border-radius:10px;padding:10px;margin:10px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:none;border-radius:8px;padding:9px 12px;font-weight:700;cursor:pointer;color:#fff}
input,textarea{background:#0b0f14;color:#eee;border:1px solid #333;border-radius:6px;padding:8px}
.card{background:#16202b;border-radius:12px;padding:10px;margin:10px 0}
#badge{position:fixed;top:8px;right:8px;background:#f39c12;color:#111;font-weight:700;padding:8px 12px;border-radius:10px;z-index:99}
img.th{width:70px;height:70px;object-fit:cover;border-radius:8px}
.cur{color:#2ecc71;font-weight:700}
h3{color:#f39c12}
</style>
</head>
<body>
<div id="badge">☑️ 0/0</div>
<h2 id="head">লোড হচ্ছে...</h2>
<div id="loginBox" class="bar" style="display:none">
<input id="em" placeholder="Email" style="flex:1"><input id="pw" type="password" placeholder="Password" style="flex:1">
<button class="btn" style="background:#2980b9" id="loginBtn">লগইন</button>
</div>
<div class="bar">
<input type="file" id="files" accept="image/*" multiple>
<button class="btn" style="background:#27ae60" id="markAll">✅ সব সিলেক্ট</button>
<button class="btn" style="background:#2980b9" id="saveSel">💾 সিলেক্টেড Save</button>
<button class="btn" style="background:#c0392b" id="delSel">🗑️ সিলেক্টেড Delete</button>
</div>
<div class="bar">
<textarea id="paste" rows="3" placeholder="প্রাইস লিস্ট (নাম — ৳দাম)" style="flex:1"></textarea>
<button class="btn" style="background:#2980b9" id="applyPaste">✅ প্রাইস বসান</button>
</div>
<div class="bar">
<input id="pct" type="number" placeholder="%" style="width:70px">
<button class="btn" style="background:#27ae60" id="applyPct">সিলেক্টেড % বসান</button>
<input id="d1" type="date"><input id="d2" type="date">
<button class="btn" style="background:#2980b9" id="applyDates">📆 তারিখ বসান</button>
</div>
<div id="bogoManager" style="background:#16202b;border-radius:12px;padding:15px;margin:15px 0;display:none">
<h3 style="color:#f39c12;margin:0 0 10px">🎁 BOGO Manager — Buy 1 Get 1 Free</h3>
<p style="color:#9ca3af;margin:0 0 10px">Mega Offers > Buy 1 Get 1 ক্যাটাগরির products এ BOGO enable করুন</p>

<div style="background:#1d2733;padding:12px;border-radius:8px;margin:10px 0">
<h4 style="margin:0 0 8px;color:#f39c12">➕ নতুন BOGO Offer</h4>
<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
<select id="bogoBuyProduct" style="flex:1;min-width:200px;padding:8px;border-radius:6px;background:#0b0f14;color:#eee;border:1px solid #333">
<option value="">⏳ Products লোড হচ্ছে...</option>
</select>
<select id="bogoType" style="width:180px;padding:8px;border-radius:6px;background:#0b0f14;color:#eee;border:1px solid #333">
<option value="same">🔄 Same Product (Buy 1 Get 1 Same)</option>
<option value="specific">🎁 Specific Free Product</option>
</select>
<input id="bogoFreeProduct" placeholder="Free Product ID" style="width:180px;padding:8px;border-radius:6px;background:#0b0f14;color:#eee;border:1px solid #333;display:none">
<input id="bogoMaxQty" type="number" value="1" min="1" max="10" style="width:80px;padding:8px;border-radius:6px;background:#0b0f14;color:#eee;border:1px solid #333" placeholder="Max Qty">
<button class="btn" style="background:#27ae60" onclick="addBogoOffer()">💾 Save</button>
</div>
</div>

<div style="background:#1d2733;padding:12px;border-radius:8px;margin:10px 0">
<h4 style="margin:0 0 8px;color:#f39c12">⚡ Bulk Enable (Low Price Products)</h4>
<p style="color:#9ca3af;margin:0 0 8px">সবচেয়ে কম দামের products একসাথে BOGO enable করুন (Amazon/Daraz style)</p>
<input id="bogoBulkCount" type="number" value="50" min="10" max="200" style="width:100px;padding:8px;border-radius:6px;background:#0b0f14;color:#eee;border:1px solid #333" placeholder="Count">
<button class="btn" style="background:#2980b9" onclick="bulkEnableBogo()">🎁 Enable</button>
<div id="bogoBulkStatus" style="margin-top:8px;color:#f39c12;font-size:13px"></div>
</div>

<div style="background:#1d2733;padding:12px;border-radius:8px;margin:10px 0">
<h4 style="margin:0 0 8px;color:#f39c12">📋 Active BOGO Offers (<span id="bogoCount">0</span>)</h4>
<input id="bogoSearch" placeholder="🔍 Search products..." style="width:100%;padding:8px;border-radius:6px;background:#0b0f14;color:#eee;border:1px solid #333;margin-bottom:8px">
<div id="bogoList" style="max-height:400px;overflow-y:auto"></div>
</div>
</div>

<div id="list"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
var CFG = {apiKey: "AIzaSyDj_LLHWBgcKfQClnaOUqEtULHhP1vSVxw",
  authDomain: "mohajon-mjh.firebaseapp.com",
  databaseURL: "https://mohajon-mjh-default-rtdb.firebaseio.com",
  projectId: "mohajon-mjh",
  storageBucket: "mohajon-mjh.firebasestorage.app",
  messagingSenderId: "526105903976",
  appId: "1:526105903976:web:f9321c6d68ecbd19d58cdd"};
firebase.initializeApp(CFG);

<!-- ========================================== -->
<!-- SMART SYNC MANAGER V8 (MULTI-SECTION COPY) -->
<!-- ========================================== -->

<div id="app-root" style="min-height:100vh; background:#121212; color:white; font-family:sans-serif;">
    
    <!-- Header Status -->
    <div style="padding:15px; background:#1e1e1e; border-bottom:1px solid #333; display:flex; justify-content:space-between; align-items:center;">
        <h2 style="margin:0;">📦 Multi-Section Sync Manager</h2>
        <span id="status-msg" style="color:#aaa; font-size:12px;">Ready to Sync All Sections</span>
    </div>

    <!-- Input Form -->
    <div style="background:#252525; padding:15px; border-bottom:1px solid #444;">
        <h3 style="margin-top:0; color:#f39c12;">➕ Add / Update Product</h3>
        <form id="prod-form" onsubmit="event.preventDefault(); handleSmartSave();">
            <input type="hidden" id="edit-id">
            
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:10px;">
                <div>
                    <label>Product Name *</label>
                    <input type="text" id="p-name" required placeholder="e.g. Samsung Galaxy A04" style="width:100%; padding:8px; background:#333; border:1px solid #555; color:white;">
                </div>
                <div>
                    <label>Price (৳) *</label>
                    <input type="number" id="p-price" required step="0.01" style="width:100%; padding:8px; background:#333; border:1px solid #555; color:white;">
                </div>
                <div>
                    <label>Discount (%)</label>
                    <input type="number" id="p-disc" value="0" min="0" max="100" style="width:100%; padding:8px; background:#333; border:1px solid #555; color:white;">
                </div>
                <div>
                    <label>Stock</label>
                    <input type="number" id="p-stock" value="10" style="width:100%; padding:8px; background:#333; border:1px solid #555; color:white;">
                </div>
                <div>
                    <label>Start Date</label>
                    <input type="date" id="p-start" style="width:100%; padding:8px; background:#333; border:1px solid #555; color:white;">
                </div>
                <div>
                    <label>End Date</label>
                    <input type="date" id="p-end" style="width:100%; padding:8px; background:#333; border:1px solid #555; color:white;">
                </div>
            </div>

            <div style="margin-bottom:10px;">
                <label>Image Upload (Cloudinary)</label>
                <input type="file" id="p-img" accept="image/*" onchange="previewImg(this)" style="width:100%; padding:8px; background:#333; border:1px solid #555; color:white;">
                <img id="img-preview" src="" style="max-width:100px; height:auto; margin-top:5px; display:none; border-radius:4px;">
            </div>

            <button type="submit" id="save-btn" style="width:100%; padding:12px; background:#2ecc71; color:black; font-weight:bold; border:none; border-radius:4px; cursor:pointer; font-size:16px;">
                💾 SAVE & SYNC TO FLASH/DEALS/SPECIAL/GLOBAL
            </button>
        </form>
    </div>

    <!-- List View -->
    <div style="padding:15px;">
        <h3>Current Section Products (<span id="current-cat-display"></span>)</h3>
        <div id="list-container">
            <p>Loading...</p>
        </div>
    </div>
</div>

<script>
// --- GLOBAL VARIABLES FROM HEAD PART ---
// db, auth, SEC, CAT are defined in lines 1-89.
// We assume they exist. If not, fallbacks:
if(typeof db === 'undefined') var db = firebase.database();
if(typeof SEC === 'undefined') var SEC = "settings/globalCategoryProducts"; 
if(typeof CAT === 'undefined') var CAT = ""; 

// Display current category name
document.getElementById('current-cat-display').innerText = CAT || "General";

// Helper: Preview Image locally before upload
window.previewImg = function(input) {
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = e => {
            const img = document.getElementById('img-preview');
            img.src = e.target.result;
            img.style.display = 'block';
        };
        reader.readAsDataURL(input.files[0]);
    }
};

// Helper: Set Status Text
function setStatus(msg, color="#aaa") {
    const el = document.getElementById('status-msg');
    el.innerText = msg;
    el.style.color = color;
}

// Load Products for Current Section
async function loadList() {
    const container = document.getElementById('list-container');
    container.innerHTML = '<p style="color:#888;text-align:center;">Fetching data...</p>';
    
    try {
        // Construct path based on current URL params (SEC/CAT)
        let fullPath = SEC;
        if(CAT) fullPath += "/" + CAT;
        
        const snap = await db.ref(fullPath).once('value');
        const data = snap.val();
        
        if(!data || Object.keys(data).length === 0) {
            container.innerHTML = '<p>No products in this section yet.</p>';
            return;
        }

        let html = '';
        Object.keys(data).forEach(key => {
            const p = data[key];
            const finalPrice = p.price ? (p.price * (1 - (p.discount||0)/100)).toFixed(2) : '?';
            
            html += `
            <div style="background:#2a2a2a; padding:10px; margin-bottom:8px; border-radius:6px; display:flex; justify-content:space-between; align-items:center; border-left:4px solid #3498db;">
                <div style="flex:1;">
                    <strong>${p.name || 'Unnamed'}</strong><br>
                    <small style="color:#aaa;">৳${p.price} (-${p.discount||0}%) -> <span style="color:#2ecc71;font-weight:bold;">৳${finalPrice}</span></small><br>
                    <small style="color:#888;">ID: ${key}</small>
                </div>
                <div style="display:flex; gap:5px;">
                    <button onclick="prepareEdit('${key}', '${fullPath}')" style="padding:5px 10px; background:#f1c40f; border:none; border-radius:3px; cursor:pointer;">✏ Edit</button>
                    <button onclick="deleteProd('${key}', '${fullPath}')" style="padding:5px 10px; background:#e74c3c; color:white; border:none; border-radius:3px; cursor:pointer;">🗑 Del</button>
                </div>
            </div>`;
        });
        container.innerHTML = html;

    } catch(e) {
        console.error(e);
        container.innerHTML = `<p style="color:red;">Error: ${e.message}</p>`;
    }
}

// Prepare Edit Mode
window.prepareEdit = async function(id, path) {
    const snap = await db.ref(`${path}/${id}`).once('value');
    const p = snap.val();
    if(!p) return alert("Not found");

    document.getElementById('edit-id').value = id;
    document.getElementById('p-name').value = p.name || "";
    document.getElementById('p-price').value = p.price || "";
    document.getElementById('p-disc').value = p.discount || 0;
    document.getElementById('p-stock').value = p.stock || 0;
    document.getElementById('p-start').value = p.startDate || "";
    document.getElementById('p-end').value = p.endDate || "";
    
    window.scrollTo(0,0);
    setStatus("Editing Mode ON", "#f1c40f");
}

// Delete Logic (Removes from ALL sections)
window.deleteProd = async function(id, path) {
    if(!confirm("Delete this product? It will be removed from ALL synced sections too.")) return;
    
    // Define all possible parent paths where this product might exist
    const parents = [
        "settings/flashSaleCategoryProducts",
        "settings/dealsOfDayCategoryProducts",
        "settings/specialCategoryProducts",
        "settings/globalCategoryProducts"
    ];

    try {
        for(let parent of parents) {
            // If CAT exists, check inside that category folder first
            if(CAT) {
                await db.ref(`${parent}/${CAT}/${id}`).remove().catch(()=>{});
            } else {
                // Fallback: Try removing directly under parent (unlikely structure but safe attempt)
                await db.ref(`${parent}/${id}`).remove().catch(()=>{});
            }
        }
        alert("Deleted from all sections.");
        loadList();
    } catch(e) {
        alert("Error deleting: " + e.message);
    }
}

// THE MAGIC: SMART SAVE & CROSS-SYNC
window.handleSmartSave = async function() {
    const btn = document.getElementById('save-btn');
    const originalText = btn.innerText;
    btn.disabled = true;
    btn.innerText = "⏳ Processing...";
    setStatus("Saving...", "#f39c12");

    const editId = document.getElementById('edit-id').value;
    const name = document.getElementById('p-name').value.trim();
    const price = parseFloat(document.getElementById('p-price').value);
    const disc = parseInt(document.getElementById('p-disc').value) || 0;
    const stock = parseInt(document.getElementById('p-stock').value) || 0;
    const start = document.getElementById('p-start').value;
    const end = document.getElementById('p-end').value;
    const imgFile = document.getElementById('p-img').files[0];

    if(!name || isNaN(price)) {
        alert("Name and Price required!");
        resetBtn(btn, originalText);
        return;
    }

    const newId = editId || Date.now().toString();
    const currentFullPath = SEC + (CAT ? "/" + CAT : "");

    try {
        // STEP 1: Handle Image Upload (Using your existing MJHCloud logic)
        let imageUrl = "";
        
        // If editing and no new file, keep old image
        if(editId && !imgFile) {
             const existingSnap = await db.ref(`${currentFullPath}/${editId}`).once('value');
             if(existingSnap.exists()) imageUrl = existingSnap.val().image || "";
        }

        if(imgFile) {
            setStatus("Uploading to Cloudinary...", "#3498db");
            // Using global MJHCloud object defined in cloudinary.js
            if(window.MJHCloud && typeof window.MJHCloud.upload === 'function') {
                const res = await window.MJHCloud.upload(imgFile);
                imageUrl = res.url;
            } else {
                throw new Error("MJHCloud uploader not found. Include cloudinary.js");
            }
        }

        // STEP 2: Create Data Object
        const prodData = {
            id: newId,
            name: name,
            price: price,
            discount: disc,
            stock: stock,
            startDate: start,
            endDate: end,
            image: imageUrl,
            updatedAt: firebase.database.ServerValue.TIMESTAMP
        };

        // STEP 3: MULTI-SECTION AUTO-SYNC LOGIC
        // We will write this same data to all 4 major section nodes
        
        const syncTargets = [
            { base: "settings/flashSaleCategoryProducts", label: "Flash Sale" },
            { base: "settings/dealsOfDayCategoryProducts", label: "Deals of the Day" },
            { base: "settings/specialCategoryProducts", label: "Special Offers" },
            { base: "settings/globalCategoryProducts", label: "Global Categories" }
        ];

        let successCount = 0;
        
        for(let target of syncTargets) {
            let writePath = target.base;
            if(CAT) writePath += "/" + CAT; // Maintain category structure
            
            try {
                await db.ref(`${writePath}/${newId}`).set(prodData);
                successCount++;
                console.log(`Synced to: ${target.label}`);
            } catch(err) {
                console.warn(`Failed to sync to ${target.label}:`, err);
            }
        }

        if(successCount > 0) {
            setStatus(`Auto-Synced to ${successCount} sections!`, "#9b59b6");
            alert(`✅ Success!\n\nSaved to current section.\nAutomatically added to ${successCount} related sections (Home/Hamburger).\n\nTarget Sections:\n- Flash Sale\n- Deals of the Day\n- Special Offers\n- Global Categories`);
        } else {
            setStatus("Saved Locally Only", "#aaa");
            alert("✅ Saved successfully to current section only.\n(Auto-sync failed due to permission or network issues).");
        }

        // Reset Form
        document.getElementById('prod-form').reset();
        document.getElementById('edit-id').value = "";
        document.getElementById('img-preview').style.display = 'none';
        loadList();

    } catch(err) {
        console.error(err);
        alert("❌ Error: " + err.message);
        setStatus("Error!", "#e74c3c");
    } finally {
        resetBtn(btn, originalText);
    }
};

function resetBtn(btn, text) {
    btn.disabled = false;
    btn.innerText = text;
}

// Init
document.addEventListener('DOMContentLoaded', () => {
    loadList();
});

</script>
<script src="mjh-mini.js"></script>
</body>
</html>
