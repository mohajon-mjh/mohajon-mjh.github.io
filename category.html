  "secondhand_refurbished_goods": {"title":"Second-Hand & Refurbished Goods","subtitle":"Quality pre-owned items at unbeatable prices","description":"<h3>♻️ Second-Hand & Refurbished Goods - Smart Shopping, Big Savings</h3>\n<p>Welcome to our Second-Hand & Refurbished Goods section, where you can find high-quality pre-owned items at a fraction of the original price. Perfect for budget-conscious shoppers who don't want to compromise on quality, this section offers incredible value on electronics, furniture, fashion, and more.</p>\n\n<p><strong>Why Choose Second-Hand & Refurbished?</strong></p>\n<ul>\n<li>💰 <strong>Huge Savings:</strong> Save 30-70% compared to brand new items</li>\n<li>🌍 <strong>Eco-Friendly:</strong> Reduce waste and support sustainable shopping</li>\n<li>✅ <strong>Quality Verified:</strong> All items are inspected and tested before listing</li>\n<li>🛡️ <strong>Warranty Included:</strong> Refurbished items come with seller warranty</li>\n</ul>\n\n<p><strong>Understanding Our Categories:</strong></p>\n<p><strong>Second-Hand (Pre-Owned):</strong> Items previously used by individuals but still in good working condition. These are sold \"as-is\" with accurate descriptions of any wear or imperfections. Perfect for items like furniture, books, clothing, and collectibles.</p>\n\n<p><strong>Refurbished:</strong> Items that have been professionally restored to like-new condition. These undergo rigorous testing, repair, and quality checks. They often come with warranty and are indistinguishable from new products in terms of performance. Ideal for electronics like laptops, phones, and appliances.</p>\n\n<p><strong>Popular Refurbished Electronics:</strong></p>\n<ul>\n<li>📱 <strong>Smartphones:</strong> iPhone, Samsung, Xiaomi - fully tested with new batteries</li>\n<li>💻 <strong>Laptops:</strong> Dell, HP, Lenovo, MacBook - upgraded RAM and SSD</li>\n<li>🖥️ <strong>Desktop Computers:</strong> Complete systems ready to use</li>\n<li>📷 <strong>Cameras:</strong> DSLR and mirrorless cameras with accessories</li>\n<li>🎮 <strong>Gaming Consoles:</strong> PlayStation, Xbox, Nintendo Switch</li>\n</ul>\n\n<p><strong>Quality Assurance Process:</strong></p>\n<p>Every refurbished item goes through our 15-point quality check:</p>\n<ol>\n<li>Complete functionality testing</li>\n<li>Battery health check (for portable devices)</li>\n<li>Screen and display inspection</li>\n<li>Physical condition assessment</li>\n<li>Software/firmware update</li>\n<li>Data wipe and factory reset</li>\n<li>Accessory verification</li>\n<li>Packaging inspection</li>\n</ol>\n\n<p><strong>Condition Grades Explained:</strong></p>\n<ul>\n<li><strong>Grade A (Like New):</strong> No visible wear, perfect condition, includes all original accessories</li>\n<li><strong>Grade B (Excellent):</strong> Minor cosmetic wear, fully functional, may include compatible accessories</li>\n<li><strong>Grade C (Good):</strong> Visible wear but fully functional, great value option</li>\n<li><strong>Grade D (Fair):</strong> Significant wear but operational, budget-friendly choice</li>\n</ul>\n\n<p><strong>Warranty & Support:</strong></p>\n<p>All refurbished items come with minimum 3-month warranty. Many items include 6-12 month coverage. Our customer support team is available to help with any issues or questions about your purchase.</p>\n\n<p><strong>Return Policy:</strong></p>\n<p>We offer a 7-day no-questions-asked return policy on all second-hand and refurbished items. If you're not satisfied, simply return the item in the same condition for a full refund.</p>\n\n<p><strong>Environmental Impact:</strong></p>\n<p>By choosing second-hand and refurbished items, you're helping reduce electronic waste and the environmental impact of manufacturing new products. It's a smart choice for both your wallet and the planet!</p>\n\n<p>Shop smart, save big, and feel good about your purchase. Browse our second-hand and refurbished collection today and find amazing deals on quality products!</p>"},
  "printing_supplies": {"title":"Printing Supplies","subtitle":"Ink, toner, paper and all printing essentials","description":"<h3>🖨️ Printing Supplies - Everything You Need for Professional Printing</h3>\n<p>Welcome to our comprehensive Printing Supplies section, your one-stop shop for all printing needs. Whether you're running a home office, small business, or large enterprise, we have the right supplies to keep your printers running smoothly and producing high-quality output.</p>\n\n<p><strong>Why Choose Our Printing Supplies?</strong></p>\n<ul>\n<li>🎨 <strong>Premium Quality:</strong> Crisp text, vibrant colors, and professional results</li>\n<li>💰 <strong>Competitive Prices:</strong> Save up to 50% compared to OEM prices</li>\n<li>🚚 <strong>Fast Delivery:</strong> Get your supplies quickly when you need them</li>\n<li>🔧 <strong>Wide Compatibility:</strong> Supplies for all major printer brands</li>\n</ul>\n\n<p><strong>Ink Cartridges:</strong></p>\n<p>We stock ink cartridges for all popular printer brands including HP, Canon, Epson, Brother, and more. Choose from:</p>\n<ul>\n<li><strong>Original OEM:</strong> Genuine manufacturer cartridges for best results</li>\n<li><strong>Compatible:</strong> Third-party alternatives at lower prices</li>\n<li><strong>Remanufactured:</strong> Recycled cartridges, eco-friendly and economical</li>\n<li><strong>XL/High-Yield:</strong> More pages per cartridge, better value</li>\n</ul>\n\n<p><strong>Toner Cartridges:</strong></p>\n<p>For laser printers, we offer toner cartridges in black and color options. Our toner delivers sharp text and consistent quality from first page to last. Available for HP LaserJet, Brother HL, Canon LBP, Samsung, and other laser printer models.</p>\n\n<p><strong>Printing Paper:</strong></p>\n<ul>\n<li><strong>Standard A4:</strong> 80gsm for everyday printing, 500 sheets per ream</li>\n<li><strong>Premium A4:</strong> 100gsm for important documents and presentations</li>\n<li><strong>Photo Paper:</strong> Glossy, matte, and semi-gloss for photo printing</li>\n<li><strong>Specialty Paper:</strong> Labels, cardstock, transparencies, and more</li>\n</ul>\n\n<p><strong>Compatible Printer Brands:</strong></p>\n<ul>\n<li>HP (DeskJet, OfficeJet, LaserJet, ENVY)</li>\n<li>Canon (PIXMA, imageCLASS, MAXIFY)</li>\n<li>Epson (EcoTank, Expression, WorkForce)</li>\n<li>Brother (HL, MFC, DCP series)</li>\n<li>Samsung (Xpress, ProXpress)</li>\n<li>And many more!</li>\n</ul>\n\n<p><strong>Specialty Printing Supplies:</strong></p>\n<ul>\n<li>🏷️ <strong>Label Papers:</strong> For shipping, product, and address labels</li>\n<li>📇 <strong>Business Card Paper:</strong> Create professional business cards at home</li>\n<li>🖼️ <strong>Canvas:</strong> For art prints and gallery-quality reproductions</li>\n<li>📜 <strong>Transfer Paper:</strong> For t-shirt and fabric printing</li>\n<li>📋 <strong>Plotter Paper:</strong> For large-format architectural and engineering prints</li>\n</ul>\n\n<p><strong>Cost-Saving Tips:</strong></p>\n<ul>\n<li>Buy in bulk for volume discounts</li>\n<li>Choose compatible or remanufactured cartridges for everyday printing</li>\n<li>Use draft mode for internal documents to save ink</li>\n<li>Print double-sided to save paper</li>\n<li>Consider EcoTank or continuous ink systems for high-volume printing</li>\n</ul>\n\n<p><strong>Business Accounts:</strong></p>\n<p>Running a business? Contact us for special business pricing, monthly supply contracts, and priority delivery. We can help optimize your printing costs and ensure you never run out of supplies.</p>\n\n<p><strong>Quality Guarantee:</strong></p>\n<p>All our printing supplies come with satisfaction guarantee. If you're not happy with print quality, we'll replace the product or refund your money. No questions asked.</p>\n\n<p>Keep your printers running at peak performance with our quality supplies. Order now and enjoy fast delivery across Bangladesh!</p>"},
  "flashsale_only": {"title":"Flash Sale","subtitle":"Limited-time deals with massive discounts","description":"<h3>⚡ Flash Sale - Unbeatable Deals, Limited Time Only!</h3>\n<p>Welcome to our Flash Sale section, where you'll find the hottest deals with massive discounts that won't last long! These are time-sensitive offers on popular products at prices you won't find anywhere else. When you see something you want, act fast - these deals disappear quickly!</p>\n\n<p><strong>Why Shop Flash Sales?</strong></p>\n<ul>\n<li>💥 <strong>Massive Discounts:</strong> Save 40-80% on selected items</li>\n<li>⏰ <strong>Limited Duration:</strong> Deals last 24-72 hours only</li>\n<li>🎯 <strong>Hand-Picked:</strong> We select only the best products for flash sales</li>\n<li>🚚 <strong>Priority Shipping:</strong> Flash sale items ship first</li>\n</ul>\n\n<p><strong>How Flash Sales Work:</strong></p>\n<p>Our flash sales run on a rotating schedule. New deals go live every day at 12:00 PM and 8:00 PM. Each sale lasts for a specific duration (usually 24-72 hours) or until stock runs out - whichever comes first. Once a flash sale ends, the product returns to its regular price.</p>\n\n<p><strong>Categories Frequently on Flash Sale:</strong></p>\n<ul>\n<li>📱 <strong>Electronics:</strong> Smartphones, earbuds, smartwatches, power banks</li>\n<li>👕 <strong>Fashion:</strong> Clothing, shoes, accessories, bags</li>\n<li>🏠 <strong>Home & Kitchen:</strong> Appliances, cookware, decor</li>\n<li>💄 <strong>Beauty:</strong> Skincare, makeup, personal care</li>\n<li>🎮 <strong>Gaming:</strong> Accessories, games, merchandise</li>\n</ul>\n\n<p><strong>Flash Sale Tips for Maximum Savings:</strong></p>\n<ol>\n<li><strong>Set Reminders:</strong> Check our site at 12 PM and 8 PM daily for new deals</li>\n<li><strong>Act Quickly:</strong> Popular items sell out within hours, sometimes minutes</li>\n<li><strong>Add to Wishlist:</strong> Save products you're interested in for quick access</li>\n<li><strong>Compare Prices:</strong> We show the original price and discount percentage</li>\n<li><strong>Bundle Deals:</strong> Sometimes buying multiple items gives extra savings</li>\n</ol>\n\n<p><strong>Stock Availability:</strong></p>\n<p>Flash sale items have limited stock - sometimes as few as 10-50 units. We display the remaining quantity in real-time so you know exactly what's available. Once it's gone, it's gone!</p>\n\n<p><strong>Price Match Guarantee:</strong></p>\n<p>Found the same flash sale item cheaper elsewhere? Contact us within 24 hours of purchase and we'll match the price plus give you an additional 10% off. That's how confident we are in our deals!</p>\n\n<p><strong>Quality Assurance:</strong></p>\n<p>Despite the deep discounts, we never compromise on quality. All flash sale items are brand new, genuine products with full manufacturer warranty. The discounts come from our direct relationships with manufacturers and bulk purchasing power.</p>\n\n<p><strong>Return Policy:</strong></p>\n<p>Flash sale items have the same 7-day return policy as regular items. If you're not satisfied, return it for a full refund - no questions asked.</p>\n\n<p><strong>Newsletter & Notifications:</strong></p>\n<p>Subscribe to our newsletter or enable browser notifications to get instant alerts when new flash sales go live. Be the first to know about the best deals!</p>\n\n<p><strong>Don't Miss Out!</strong></p>\n<p>Flash sales are our way of saying thank you to our loyal customers. These deals are designed to give you maximum value on products you love. Browse our current flash sale items now and grab amazing deals before they're gone!</p>\n\n<p>Remember: Good things come to those who act fast. Happy shopping!</p>"},
  "musical_instruments": {"title":"Musical Instruments","subtitle":"Guitars, keyboards, drums and more for every musician","description":"<h3>🎵 Musical Instruments - From Beginners to Professionals</h3>\n<p>Welcome to our Musical Instruments section, where passion meets performance! Whether you're just starting your musical journey or you're a seasoned professional, we have the perfect instrument for you. Explore our carefully curated collection of guitars, keyboards, drums, wind instruments, and more from trusted brands worldwide.</p>\n\n<p><strong>Why Choose Our Musical Instruments?</strong></p>\n<ul>\n<li>🎸 <strong>Quality Brands:</strong> Yamaha, Fender, Gibson, Roland, Casio, and more</li>\n<li>🎓 <strong>All Levels:</strong> Beginner-friendly to professional-grade instruments</li>\n<li>🎁 <strong>Complete Kits:</strong> Instruments with accessories and learning materials</li>\n<li>🔧 <strong>Expert Support:</strong> Our team includes musicians who can guide your choice</li>\n</ul>\n\n<p><strong>Guitars - The Heart of Modern Music:</strong></p>\n<ul>\n<li><strong>Acoustic Guitars:</strong> Perfect for beginners and singer-songwriters. Steel-string for bright sound, nylon-string for classical and flamenco styles.</li>\n<li><strong>Electric Guitars:</strong> For rock, blues, jazz, and metal players. Stratocaster, Les Paul, and other iconic body shapes available.</li>\n<li><strong>Bass Guitars:</strong> 4-string and 5-string options for laying down the groove.</li>\n<li><strong>Ukuleles:</strong> Fun, portable, and great for beginners of all ages.</li>\n</ul>\n\n<p><strong>Keyboards & Pianos:</strong></p>\n<ul>\n<li><strong>Digital Pianos:</strong> Authentic piano feel with modern features. Perfect for home practice and performance.</li>\n<li><strong>Keyboards:</strong> 61, 76, and 88-key options with hundreds of sounds and rhythms.</li>\n<li><strong>Synthesizers:</strong> For electronic music production and sound design.</li>\n<li><strong>MIDI Controllers:</strong> Connect to your computer for music production.</li>\n</ul>\n\n<p><strong>Drums & Percussion:</strong></p>\n<ul>\n<li><strong>Acoustic Drum Kits:</strong> Complete 5-piece kits for rock and jazz drummers.</li>\n<li><strong>Electronic Drums:</strong> Silent practice with realistic feel. Great for apartments!</li>\n<li><strong>Cajons & Bongos:</strong> Portable percussion for acoustic sessions.</li>\n<li><strong>Djembes & Congas:</strong> World percussion instruments for diverse rhythms.</li>\n</ul>\n\n<p><strong>Wind & Brass Instruments:</strong></p>\n<ul>\n<li><strong>Flutes:</strong> Student and professional models in C and other keys.</li>\n<li><strong>Recorders:</strong> Perfect introduction to wind instruments for children.</li>\n<li><strong>Harmonicas:</strong> Diatonic and chromatic for blues, folk, and more.</li>\n<li><strong>Saxophones:</strong> Alto, tenor, and soprano options.</li>\n</ul>\n\n<p><strong>String Instruments:</strong></p>\n<ul>\n<li><strong>Violins:</strong> Student, intermediate, and professional levels.</li>\n<li><strong>Cellos:</strong> For classical and contemporary players.</li>\n<li><strong>Sitar & Tabla:</strong> Traditional Indian instruments for classical music.</li>\n</ul>\n\n<p><strong>Accessories & Equipment:</strong></p>\n<ul>\n<li>🎤 <strong>Microphones:</strong> Vocal, instrument, and USB mics for recording</li>\n<li>🎧 <strong>Headphones:</strong> Studio monitors for practice and mixing</li>\n<li>🔌 <strong>Amplifiers:</strong> Guitar, bass, and keyboard amps</li>\n<li>🎚️ <strong>Effects Pedals:</strong> Shape your sound with effects</li>\n<li>📚 <strong>Learning Materials:</strong> Books, DVDs, and online courses</li>\n<li>🎒 <strong>Cases & Bags:</strong> Protect your instruments during transport</li>\n</ul>\n\n<p><strong>Beginner Packages:</strong></p>\n<p>Just starting out? Our beginner packages include everything you need: instrument, accessories, learning materials, and sometimes even online lessons. It's the perfect way to start your musical journey without buying items separately.</p>\n\n<p><strong>Professional Advice:</strong></p>\n<p>Not sure which instrument is right for you? Our team of experienced musicians can help you choose based on your musical goals, budget, and experience level. Contact us for personalized recommendations!</p>\n\n<p><strong>Financing Options:</strong></p>\n<p>Professional instruments can be a significant investment. We offer EMI options for purchases above ৳20,000, making it easier to get the instrument you've been dreaming of.</p>\n\n<p>Start your musical journey today or upgrade to your dream instrument. With Cash on Delivery and easy returns, finding the perfect instrument has never been easier!</p>"},
  "electrical_equipment_supplies": {"title":"Electrical Equipment & Supplies","subtitle":"Professional-grade electrical products for homes and businesses","description":"<h3>⚡ Electrical Equipment & Supplies - Powering Homes and Businesses</h3>\n<p>Welcome to our comprehensive Electrical Equipment & Supplies section, where we offer everything you need for electrical installations, repairs, and upgrades. From basic wiring supplies to advanced industrial equipment, we have the right products for electricians, contractors, and DIY enthusiasts alike.</p>\n\n<p><strong>Why Choose Our Electrical Supplies?</strong></p>\n<ul>\n<li>⚡ <strong>Safety Certified:</strong> All products meet BIS and international safety standards</li>\n<li>🏆 <strong>Trusted Brands:</strong> Schneider, Legrand, Havells, Anchor, Polycab, and more</li>\n<li>📦 <strong>Bulk Available:</strong> Wholesale pricing for contractors and businesses</li>\n<li>🔧 <strong>Expert Support:</strong> Technical assistance for complex projects</li>\n</ul>\n\n<p><strong>Wiring & Cables:</strong></p>\n<ul>\n<li><strong>House Wiring:</strong> PVC insulated copper cables in 1mm, 1.5mm, 2.5mm, 4mm, and 6mm sizes</li>\n<li><strong>Power Cables:</strong> Heavy-duty cables for appliances and machinery</li>\n<li><strong>Data Cables:</strong> Cat5e, Cat6, Cat7 for networking and internet</li>\n<li><strong>Coaxial Cables:</strong> For TV, CCTV, and satellite connections</li>\n<li><strong>Flexible Cables:</strong> For appliances and extension cords</li>\n</ul>\n\n<p><strong>Switches & Sockets:</strong></p>\n<ul>\n<li><strong>Modular Switches:</strong> Modern, sleek designs in various finishes</li>\n<li><strong>Traditional Switches:</strong> Classic toggle and rocker switches</li>\n<li><strong>Sockets:</strong> 5A, 15A, and 20A sockets for different appliances</li>\n<li><strong>USB Sockets:</strong> Built-in USB charging for modern homes</li>\n<li><strong>Dimmer Switches:</strong> Control lighting ambiance</li>\n</ul>\n\n<p><strong>Circuit Protection:</strong></p>\n<ul>\n<li><strong>MCBs (Miniature Circuit Breakers):</strong> Single, double, and triple pole options</li>\n<li><strong>RCCBs (Residual Current Circuit Breakers):</strong> Protection against electric shock</li>\n<li><strong>Fuses:</strong> Cartridge and HRC fuses for various applications</li>\n<li><strong>Surge Protectors:</strong> Protect sensitive electronics from voltage spikes</li>\n<li><strong>Distribution Boards:</strong> Main and sub-distribution boards for organized wiring</li>\n</ul>\n\n<p><strong>Lighting Controls:</strong></p>\n<ul>\n<li><strong>Motion Sensors:</strong> Automatic lighting for security and convenience</li>\n<li><strong>Timer Switches:</strong> Programmable lighting schedules</li>\n<li><strong>Smart Switches:</strong> WiFi and Bluetooth controlled switches</li>\n<li><strong>Relay Modules:</strong> For automated lighting systems</li>\n</ul>\n\n<p><strong>Tools & Testing Equipment:</strong></p>\n<ul>\n<li>🔨 <strong>Wire Strippers & Cutters:</strong> Professional-grade tools</li>\n<li>📏 <strong>Multimeters:</strong> Digital and analog for testing voltage, current, resistance</li>\n<li>🔌 <strong>Clamp Meters:</strong> Non-contact current measurement</li>\n<li>🔍 <strong>Voltage Testers:</strong> Non-contact voltage detectors</li>\n<li>🧰 <strong>Tool Kits:</strong> Complete electrician tool sets</li>\n</ul>\n\n<p><strong>Industrial Electrical:</strong></p>\n<ul>\n<li><strong>Motor Starters:</strong> DOL, star-delta, and soft starters</li>\n<li><strong>Contactors:</strong> For controlling high-power loads</li>\n<li><strong>Transformers:</strong> Step-up and step-down transformers</li>\n<li><strong>Control Panels:</strong> Custom-built for industrial applications</li>\n<li><strong>Generators:</strong> Backup power solutions</li>\n</ul>\n\n<p><strong>Safety Equipment:</strong></p>\n<ul>\n<li>🧤 <strong>Insulated Gloves:</strong> Protection against electric shock</li>\n<li>👓 <strong>Safety Goggles:</strong> Eye protection during electrical work</li>\n<li>🦺 <strong>Safety Boots:</strong> Electrical hazard rated footwear</li>\n<li>⚠️ <strong>Warning Signs:</strong> Safety signage for electrical areas</li>\n</ul>\n\n<p><strong>Smart Home Electrical:</strong></p>\n<p>Upgrade your home with smart electrical solutions:</p>\n<ul>\n<li>Smart switches controllable via smartphone</li>\n<li>Automated lighting schedules</li>\n<li>Energy monitoring systems</li>\n<li>Voice-controlled devices (Google Home, Alexa compatible)</li>\n<li>Smart plugs for individual appliance control</li>\n</ul>\n\n<p><strong>For Electricians & Contractors:</strong></p>\n<p>Running an electrical business? We offer special contractor pricing, bulk discounts, and priority delivery. Open a business account to access wholesale prices and dedicated support.</p>\n\n<p><strong>Safety First:</strong></p>\n<p>Electrical work can be dangerous. Always follow safety guidelines, use proper protective equipment, and when in doubt, consult a licensed electrician. Never attempt work beyond your skill level.</p>\n\n<p><strong>Quality Guarantee:</strong></p>\n<p>All our electrical products come with manufacturer warranty and are sourced from authorized distributors. We guarantee authenticity and quality on every product.</p>\n\n<p>Whether you're wiring a new home, upgrading an old installation, or working on an industrial project, we have the electrical supplies you need. Shop with confidence knowing you're getting quality products at competitive prices!</p>"},
  "mobile_phones_accessories": {"title":"Mobile Phones & Accessories","subtitle":"Latest smartphones and essential accessories","description":"<h3>📱 Mobile Phones & Accessories - Stay Connected in Style</h3>\n<p>Welcome to our Mobile Phones & Accessories section, your ultimate destination for the latest smartphones and all the accessories you need to enhance your mobile experience. From flagship devices to budget-friendly options, we have the perfect phone for every need and budget.</p>\n\n<p><strong>Why Shop Mobile Phones With Us?</strong></p>\n<ul>\n<li>📱 <strong>Latest Models:</strong> iPhone, Samsung, Xiaomi, Oppo, Vivo, Realme, and more</li>\n<li>💰 <strong>Best Prices:</strong> Competitive pricing with regular offers</li>\n<li>🛡️ <strong>Official Warranty:</strong> All phones come with manufacturer warranty</li>\n<li>🎁 <strong>Free Gifts:</strong> Accessories and extended warranty on selected models</li>\n</ul>\n\n<p><strong>Smartphones by Brand:</strong></p>\n<p><strong>Apple iPhone:</strong> The latest iPhone 15, iPhone 15 Pro, iPhone 15 Pro Max, and previous generations. Known for premium build quality, excellent cameras, and seamless iOS experience.</p>\n\n<p><strong>Samsung Galaxy:</strong> Galaxy S series (S24, S24+, S24 Ultra), Galaxy A series, Galaxy M series, and foldable phones (Z Fold, Z Flip). Samsung offers excellent displays, powerful performance, and versatile cameras.</p>\n\n<p><strong>Xiaomi:</strong> Redmi, Mi, and POCO series offering incredible value for money. Known for great specs at affordable prices.</p>\n\n<p><strong>Oppo & Vivo:</strong> Stylish designs with excellent selfie cameras and fast charging technology.</p>\n\n<p><strong>Realme:</strong> Performance-focused phones with gaming features at competitive prices.</p>\n\n<p><strong>Google Pixel:</strong> Pure Android experience with exceptional camera capabilities.</p>\n\n<p><strong>OnePlus:</strong> Flagship killers with fast performance and clean OxygenOS.</p>\n\n<p><strong>Key Fea n<li>💡 <strong>Ring Lights:</strong> For selfies and video calls</li>\n<li>🎤 <strong>Lavalier Mics:</strong> For clear audio in videos</li>\n</ul>\n\n<p><strong>Smart Accessories:</strong></p>\n<ul>\n<li>⌚ <strong>Smartwatches:</strong> Compatible with your phone</li>\n<li>🏃 <strong>Fitness Trackers:</strong> Health and activity monitoring</li>\n<li>🎮 <strong>Gaming Controllers:</strong> Mobile gaming accessories</li>\n<li>📡 <strong>Trackers:</strong> Find your phone and other items</li>\n</ul>\n\n<p><strong>Trade-In Program:</strong></p>\n<p>Upgrade to a new phone? Trade in your old device and get instant discount on your new purchase. We accept phones in working condition from all major brands.</p>\n\n<p><strong>EMI Options:</strong></p>\n<p>Make your dream phone affordable with our EMI plans. Available for purchases above ৳15,000 through major banks and financial institutions. 0% interest options available on selected models.</p>\n\n<p><strong>After-Sales Support:</strong></p>\n<p>Our service doesn't end with the sale. We provide support for warranty claims, software issues, and general queries. Visit our service centers or contact us online for assistance.</p>\n\n<p>Find your perfect smartphone and all the accessories you need to make the most of it. With Cash on Delivery and easy returns, shopping for mobile phones has never been easier!</p>"},
  "computers_tablets_networking": {"title":"Computers, Tablets & Networking","subtitle":"Laptops, desktops, tablets and networking equipment","description":"<h3>💻 Computers, Tablets & Networking - Technology for Work and Play</h3>\n<p>Welcome to our Computers, Tablets & Networking section, where we offer everything you need for computing, whether it's for work, study, gaming, or entertainment. From powerful laptops to portable tablets and reliable networking equipment, we have solutions for every need and budget.</p>\n\n<p><strong>Why Choose Our Computer Products?</strong></p>\n<ul>\n<li>💻 <strong>Latest Technology:</strong> Current generation processors and components</li>\n<li>🏆 <strong>Trusted Brands:</strong> Dell, HP, Lenovo, ASUS, Apple, Acer, and more</li>\n<li>🎓 <strong>Expert Advice:</strong> Our team can help you choose the right system</li>\n<li>🛡️ <strong>Warranty & Support:</strong> Manufacturer warranty plus our support</li>\n</ul>\n\n<p><strong>Laptops:</strong></p>\n<p><strong>For Students:</strong> Lightweight, long battery life, affordable. Perfect for note-taking, research, and assignments. 13-14 inch screens, Intel Core i3/i5 or AMD Ryzen 3/5 processors.</p>\n\n<p><strong>For Professionals:</strong> Powerful performance, premium build, security features. 14-15 inch screens, Intel Core i5/i7 or AMD Ryzen 5/7, 8-16GB RAM, SSD storage.</p>\n\n<p><strong>For Gaming:</strong> High-performance graphics, fast displays, advanced cooling. Dedicated NVIDIA or AMD graphics cards, high refresh rate displays, RGB lighting.</p>\n\n<p><strong>For Creators:</strong> Color-accurate displays, powerful processors, ample RAM. 4K displays, dedicated graphics, 16-32GB RAM, large SSD storage.</p>\n\n<p><strong>2-in-1 Convertibles:</strong> Versatile devices that work as both laptop and tablet. Touch screens, stylus support, flexible hinges.</p>\n\n<p><strong>Desktop Computers:</strong></p>\n<p><strong>All-in-One:</strong> Space-saving design with built-in monitor. Perfect for home offices and small spaces.</p>\n\n<p><strong>Tower Desktops:</strong> Powerful and upgradeable. Ideal for gaming, video editing, and demanding tasks.</p>\n\n<p><strong>Mini PCs:</strong> Compact form factor for basic computing needs. Great for kiosks, digital signage, and light office work.</p>\n\n<p><strong>Workstations:</strong> Professional-grade systems for engineering, design, and scientific applications.</p>\n\n<p><strong>Tablets:</strong></p>\n<p><strong>iPad:</strong> Premium tablets with excellent displays and app ecosystem. iPad, iPad Air, iPad Pro, iPad Mini.</p>\n\n<p><strong>Android Tablets:</strong> Samsung Galaxy Tab, Lenovo Tab, Xiaomi Pad, and more. Various sizes from 8 to 12 inches.</p>\n\n<p><strong>Windows Tablets:</strong> Surface Pro, Surface Go, and other Windows tablets for productivity on the go.</p>\n\n<p><strong>Kids' Tablets:</strong> Durable, parental controls, educational apps. Perfect for children.</p>\n\n<p><strong>Tablet Accessories:</strong></p>\n<ul>\n<li>📱 <strong>Cases:</strong> Protective covers in various styles</li>\n<li>⌨️ <strong>Keyboards:</strong> Detachable and Bluetooth keyboards</li>\n<li>✏️ <strong>Stylus:</strong> For drawing and note-taking</li>\n<li>🔋 <strong>Chargers:</strong> Fast chargers and power banks</li>\n<li>🎧 <strong>Headphones:</strong> For media consumption</li>\n</ul>\n\n<p><strong>Computer Components:</strong></p>\n<p><strong>Processors:</strong> Intel Core i3/i5/i7/i9, AMD Ryzen 3/5/7/9, AMD Threadripper for workstations.</p>\n\n<p><strong>Graphics Cards:</strong> NVIDIA GeForce RTX series, AMD Radeon RX series for gaming and creative work.</p>\n\n<p><strong>Memory (RAM):</strong> DDR4 and DDR5 RAM in 4GB to 64GB capacities.</p>\n\n<p><strong>Storage:</strong> SSDs (NVMe, SATA), HDDs for bulk storage, external drives.</p>\n\n<p><strong>Motherboards:</strong> For Intel and AMD processors in various form factors.</p>\n\n<p><strong>Power Supplies:</strong> Reliable PSUs for desktop builds.</p>\n\n<p><strong>Cases:</strong> PC cases in various sizes and styles.</p>\n\n<p><strong>Cooling:</strong> CPU coolers, case fans, liquid cooling solutions.</p>\n\n<p><strong>Networking Equipment:</strong></p>\n<p><strong>Routers:</strong> WiFi 5 and WiFi 6 routers for fast home networking. Mesh systems for large homes.</p>\n\n<p><strong>Modems:</strong> Cable and DSL modems for internet connectivity.</p>\n\n<p><strong>Switches:</strong> Network switches for expanding wired connections.</p>\n\n<p><strong>Access Points:</strong> Extend WiFi coverage in large spaces.</p>\n\n<p><strong>Network Cables:</strong> Cat5e, Cat6, Cat7 Ethernet cables.</p>\n\n<p><strong>Network Storage (NAS):</strong> Personal cloud storage for homes and businesses.</p>\n\n<p><strong>Computer Peripherals:</strong></p>\n<ul>\n<li>🖥️ <strong>Monitors:</strong> 21-34 inch, 4K, ultrawide, gaming monitors</li>\n<li>⌨️ <strong>Keyboards:</strong> Mechanical, membrane, wireless, ergonomic</li>\n<li>🖱️ <strong>Mice:</strong> Optical, laser, wireless, gaming mice</li>\n<li>🖨️ <strong>Printers:</strong> Inkjet, laser, all-in-one printers</li>\n<li>📷 <strong>Webcams:</strong> For video calls and streaming</li>\n<li>🎤 <strong>Microphones:</strong> USB and XLR microphones</li>\n<li>🔊 <strong>Speakers:</strong> Desktop speakers, soundbars</li>\n</ul>\n\n<p><strong>Software:</strong></p>\n<ul>\n<li>💻 <strong>Operating Systems:</strong> Windows 11, macOS</li>\n<li>📊 <strong>Office Suites:</strong> Microsoft Office, WPS Office</li>\n<li>🛡️ <strong>Antivirus:</strong> Norton, McAfee, Kaspersky, Bitdefender</li>\n<li>🎨 <strong>Creative Software:</strong> Adobe Creative Cloud alternatives</li>\n</ul>\n\n<p><strong>Business Solutions:</strong></p>\n<p>Running a business? We offer bulk pricing, business accounts, and dedicated support for companies. From single workstations to complete office setups, we can help equip your team.</p>\n\n<p><strong>Custom Builds:</strong></p>\n<p>Need a specific configuration? We offer custom PC building services. Tell us your requirements and budget, and we'll build the perfect system for you.</p>\n\n<p><strong>Financing Options:</strong></p>\n<p>Make technology affordable with our EMI plans. Available for purchases above ৳25,000. 0% interest options on selected products.</p>\n\n<p>Find the perfect computer, tablet, or networking solution for your needs. With expert advice, competitive prices, and reliable support, we're here to help you make the right choice!</p>"},
  "beauty_personal_care": {"title":"Beauty & Personal Care","subtitle":"Skincare, makeup, haircare and wellness products","description":"<h3>💄 Beauty & Personal Care - Look Good, Feel Great</h3>\n<p>Welcome to our Beauty & Personal Care section, your ultimate destination for all things beauty and wellness. From skincare essentials to professional makeup, haircare products to personal hygiene items, we offer a comprehensive range of products to help you look and feel your best every day.</p>\n\n<p><strong>Why Shop Beauty Products With Us?</strong></p>\n<ul>\n<li>✨ <strong>Authentic Products:</strong> 100% genuine products from authorized distributors</li>\n<li>🌿 <strong>Wide Range:</strong> Local and international brands for every skin type and concern</li>\n<li>💰 <strong>Great Prices:</strong> Competitive pricing with regular offers and discounts</li>\n<li>🎁 <strong>Free Samples:</strong> Try new products with free samples on selected orders</li>\n</ul>\n\n<p><strong>Skincare - The Foundation of Beauty:</strong></p>\n<p><strong>Cleansers:</strong> Face washes, cleansing oils, micellar water for all skin types. Remove dirt, oil, and makeup without stripping natural moisture.</p>\n\n<p><strong>Toners:</strong> Balance skin pH, minimize pores, and prepare skin for serums and moisturizers. Alcohol-free options available.</p>\n\n<p><strong>Serums & Essences:</strong> Concentrated treatments targeting specific concerns like wrinkles, dark spots, acne, and hydration.</p>\n\n<p><strong>Moisturizers:</strong> Day creams, night creams, gel moisturizers, and facial oils for all skin types. Keep skin hydrated and protected.</p>\n\n<p><strong>Sun Protection:</strong> Sunscreens with SPF 30-50+ for face and body. Protect against UV damage and premature aging.</p>\n\n<p><strong>Face Masks:</strong> Sheet masks, clay masks, sleeping masks for intensive treatment. Use 2-3 times a week for best results.</p>\n\n<p><strong>Eye Care:</strong> Eye creams and serums for dark circles, puffiness, and fine lines.</p>\n\n<p><strong>Makeup - Express Your Style:</strong></p>\n<p><strong>Face:</strong> Foundations, concealers, powders, blushes, bronzers, and highlighters for a flawless complexion.</p>\n\n<p><strong>Eyes:</strong> Eyeshadow palettes, eyeliners, mascaras, eyebrow pencils, and false lashes for dramatic or natural looks.</p>\n\n<p><strong>Lips:</strong> Lipsticks, lip glosses, lip liners, lip balms in every color imaginable. Long-lasting and hydrating formulas.</p>\n\n<p><strong>Nails:</strong> Nail polishes, nail art supplies, nail care products for beautiful, healthy nails.</p>\n\n<p><strong>Makeup Tools:</strong> Brushes, sponges, applicators, and makeup removers for professional application.</p>\n\n<p><strong>Haircare - Healthy Hair, Happy You:</strong></p>\n<p><strong>Shampoos:</strong> For all hair types - normal, dry, oily, colored, damaged. Sulfate-free options available.</p>\n\n<p><strong>Conditioners:</strong> Deep conditioners, leave-in conditioners, hair masks for nourishment and repair.</p>\n\n<p><strong>Hair Treatments:</strong> Serums, oils, and treatments for specific concerns like hair fall, dandruff, frizz, and damage.</p>\n\n<p><strong>Styling Products:</strong> Gels, mousses, hairsprays, heat protectants for creating and maintaining styles.</p>\n\n<p><strong>Hair Color:</strong> Permanent, semi-permanent, and temporary hair colors. At-home coloring kits and professional products.</p>\n\n<p><strong>Hair Tools:</strong> Hair dryers, straighteners, curling irons, brushes, and combs.</p>\n\n<p><strong>Personal Care & Hygiene:</strong></p>\n<p><strong>Body Care:</strong> Body washes, body lotions, body scrubs, and body oils for soft, smooth skin.</p>\n\n<p><strong>Oral Care:</strong> Toothpastes, toothbrushes, mouthwashes, and dental floss for healthy teeth and gums.</p>\n\n<p><strong>Deodorants & Antiperspirants:</strong> Keep fresh all day with our range of deodorants in various scents.</p>\n\n<p><strong>Shaving & Hair Removal incare routine, recommend makeup for your skin tone, or suggest haircare products for your hair type. Contact us for free consultations!</p>\n\n<p><strong>Subscription Boxes:</strong></p>\n<p>Try our monthly beauty subscription boxes and discover new products every month. Curated selections of skincare, makeup, and haircare products at a fraction of the retail price.</p>\n\n<p><strong>Gift Sets:</strong></p>\n<p>Looking for the perfect gift? Our beauty gift sets are beautifully packaged and include full-size products at great value. Perfect for birthdays, anniversaries, and special occasions.</p>\n\n<p>Start your beauty journey today with our carefully selected products. With authentic products, great prices, and expert advice, achieving your beauty goals has never been easier!</p>"},

const FIREBASE_BASE = "https://mohajon-mjh-default-rtdb.firebaseio.com";

function getCategoryFromURL() {
  const params = new URLSearchParams(window.location.search);
  return params.get('id') || 'agriculture_food_beverage';
}

function formatCategoryName(slug) {
  return slug.split('_').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}

async function loadCategory() {
  const categoryId = getCategoryFromURL();
  const info = CATEGORY_INFO[categoryId] || CATEGORY_INFO.default;
  
  document.getElementById('categoryTitle').textContent = info.title;
  document.getElementById('categorySubtitle').textContent = info.subtitle;
  document.getElementById('descriptionSection').innerHTML = info.description;
  document.title = `${info.title} - Mohajon MJH Marketplace`;
  
  const grid = document.getElementById('productGrid');
  grid.innerHTML = '<p style="text-align:center;padding:40px;color:#999">Loading products...</p>';
  
  try {
    const res = await fetch(`${FIREBASE_BASE}/products.json`);
    const products = await res.json();
    
    const categoryProducts = Object.entries(products)
      .filter(([id, p]) => p.categoryId === categoryId)
      .map(([id, p]) => ({id, ...p}));
    
    if (categoryProducts.length === 0) {
      grid.innerHTML = `<div class="no-products"><h3>No products found in this category</h3><p><a href="/">← Back to Home</a></p></div>`;
      return;
    }
    
    grid.innerHTML = categoryProducts.slice(0, 20).map(p => `
      <div class="product-card" onclick="window.location.href='/product-details.html?id=${p.id}'">
        <img src="${p.images?.main || '/assets/images/categories/' + categoryId + '.png'}" alt="${p.title}" onerror="this.src='/assets/images/categories/default.png'">
        <div class="info">
          <h3>${p.title}</h3>
          <div class="price">৳${p.price || 0}${p.oldPrice ? `<span class="old-price">৳${p.oldPrice}</span>` : ''}</div>
          <button>View Details</button>
        </div>
      </div>
    `).join('');
    
    if (categoryProducts.length > 20) {
      grid.innerHTML += `<p style="grid-column:1/-1;text-align:center;padding:20px;color:#666">Showing 20 of ${categoryProducts.length} products. <a href="/home-products.html" style="color:#2980b9">View all →</a></p>`;
    }
  } catch (err) {
    grid.innerHTML = `<div class="no-products"><h3>Error loading products</h3><p>Please try again later or <a href="/">go to homepage</a></p></div>`;
  }
}

loadCategory();
</script>
