const FIREBASE_BASE = "https://mohajon-mjh-default-rtdb.firebaseio.com";

function getCategoryFromURL() {
  const params = new URLSearchParams(window.location.search);
  return params.get('id') || 'agriculture_food_beverage';
}

function formatCategoryName(slug) {
  return slug.split('_').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}

async function loadCategory() {
  const categoryId = getCategoryFromURL();
  const info = CATEGORY_INFO[categoryId] || CATEGORY_INFO.default;
  
  document.getElementById('categoryTitle').textContent = info.title;
  document.getElementById('categorySubtitle').textContent = info.subtitle;
  document.getElementById('descriptionSection').innerHTML = info.description;
  document.title = `${info.title} - Mohajon MJH Marketplace`;
  
  const grid = document.getElementById('productGrid');
  grid.innerHTML = '<p style="text-align:center;padding:40px;color:#999">Loading products...</p>';
  
  try {
    const res = await fetch(`${FIREBASE_BASE}/products.json`);
    const products = await res.json();
    
    const categoryProducts = Object.entries(products)
      .filter(([id, p]) => p.categoryId === categoryId)
      .map(([id, p]) => ({id, ...p}));
    
    if (categoryProducts.length === 0) {
      grid.innerHTML = `<div class="no-products"><h3>No products found in this category</h3><p><a href="/">← Back to Home</a></p></div>`;
      return;
    }
    
    grid.innerHTML = categoryProducts.slice(0, 20).map(p => `
      <div class="product-card" onclick="window.location.href='/product-details.html?id=${p.id}'">
        <img src="${p.images?.main || '/assets/images/categories/' + categoryId + '.png'}" alt="${p.title}" onerror="this.src='/assets/images/categories/default.png'">
        <div class="info">
          <h3>${p.title}</h3>
          <div class="price">৳${p.price || 0}${p.oldPrice ? `<span class="old-price">৳${p.oldPrice}</span>` : ''}</div>
          <button>View Details</button>
        </div>
      </div>
    `).join('');
    
    if (categoryProducts.length > 20) {
      grid.innerHTML += `<p style="grid-column:1/-1;text-align:center;padding:20px;color:#666">Showing 20 of ${categoryProducts.length} products. <a href="/home-products.html" style="color:#2980b9">View all →</a></p>`;
    }
  } catch (err) {
    grid.innerHTML = `<div class="no-products"><h3>Error loading products</h3><p>Please try again later or <a href="/">go to homepage</a></p></div>`;
  }
}

loadCategory();
