<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔍 Color Debug Test</title>
<style>
body { font-family: Arial; padding: 20px; background: #111; color: #fff; }
.step { margin: 15px 0; padding: 15px; border-radius: 8px; }
.success { background: #1a4d1a; border-left: 4px solid #4caf50; }
.error { background: #4d1a1a; border-left: 4px solid #f44336; }
.warning { background: #4d4d1a; border-left: 4px solid #ff9800; }
h3 { margin-top: 0; }
img { max-width: 100px; border-radius: 4px; margin: 5px; }
pre { background: #000; padding: 10px; border-radius: 4px; overflow-x: auto; font-size: 12px; }
</style>
</head>
<body>

<h1>🔍 Color Loading Debug Test</h1>
<p>Product ID: <code>p_1791119540146_0</code></p>

<div id="output"></div>

<script>
const DB = "https://mohajon-mjh-default-rtdb.firebaseio.com";
const id = "p_1791119540146_0";
const output = document.getElementById('output');

function log(msg, type='success') {
  const div = document.createElement('div');
  div.className = 'step ' + type;
  div.innerHTML = msg;
  output.appendChild(div);
}

async function test() {
  try {
    // STEP 1: Fetch master product
    log('<h3>Step 1: Fetch master product</h3>');
    const masterRes = await fetch(DB + '/products/' + id + '.json');
    const master = await masterRes.json();
    
    if (!master) {
      log('<h3>❌ Master product not found</h3>', 'error');
      return;
    }
    log('<h3>✅ Master loaded</h3><pre>' + JSON.stringify(master, null, 2).substring(0, 500) + '...</pre>');
    
    // STEP 2: Fetch productsPage item
    log('<h3>Step 2: Fetch productsPage item</h3>');
    const pageRes = await fetch(DB + '/productsPage/items/' + id + '.json');
    const pageItem = await pageRes.json();
    
    if (!pageItem) {
      log('<h3>❌ productsPage item not found</h3>', 'error');
      return;
    }
    log('<h3>✅ productsPage loaded</h3><pre>' + JSON.stringify(pageItem, null, 2).substring(0, 500) + '...</pre>');
    
    // STEP 3: Check colors in productsPage
    log('<h3>Step 3: Check colors array</h3>');
    const colors = pageItem.colors || [];
    log('<h3>✅ Colors count: ' + colors.length + '</h3>');
    
    if (colors.length === 0) {
      log('<h3>❌ No colors found in productsPage!</h3>', 'error');
      return;
    }
    
    // STEP 4: Check first color structure
    log('<h3>Step 4: Check first color structure</h3>');
    const first = colors[0];
    log('<h3>First color:</h3><pre>' + JSON.stringify(first, null, 2) + '</pre>');
    
    if (!first.images || !first.images[0]) {
      log('<h3>❌ First color has no images!</h3>', 'error');
      return;
    }
    
    log('<h3>✅ First color image:</h3><img src="' + first.images[0] + '">');
    
    // STEP 5: Simulate merge logic
    log('<h3>Step 5: Simulate merge (p.colors = pn.colors)</h3>');
    let p = master;
    let pn = pageItem;
    
    if (pn && pn.colors && pn.colors.length) {
      p.colors = pn.colors;
      log('<h3>✅ Merge successful: p.colors.length = ' + p.colors.length + '</h3>');
    } else {
      log('<h3>❌ Merge failed: pn.colors is empty or missing</h3>', 'error');
      return;
    }
    
    // STEP 6: Render test (first 3 colors)
    log('<h3>Step 6: Render test (first 3 colors)</h3>');
    let html = '<div style="display:flex;gap:10px;flex-wrap:wrap">';
    p.colors.slice(0, 3).forEach((c, i) => {
      const img = (c.images && c.images[0]) || '';
      html += '<div style="text-align:center">';
      html += '<img src="' + img + '" style="width:80px;height:80px;object-fit:cover">';
      html += '<div style="font-size:12px;margin-top:5px">' + (c.name || 'Color ' + (i+1)) + '</div>';
      html += '</div>';
    });
    html += '</div>';
    log(html);
    
    // FINAL
    log('<h3>🎉 All tests passed! Colors should render correctly.</h3>', 'success');
    
  } catch (e) {
    log('<h3>❌ Error: ' + e.message + '</h3><pre>' + e.stack + '</pre>', 'error');
  }
}

test();
</script>

</body>
</html>
